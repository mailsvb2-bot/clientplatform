name: clientplatform-production

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: clientplatform
      POSTGRES_USER: clientplatform_admin
      POSTGRES_PASSWORD: ${CLIENTPLATFORM_POSTGRES_ADMIN_PASSWORD:?set CLIENTPLATFORM_POSTGRES_ADMIN_PASSWORD}
      CLIENTPLATFORM_POSTGRES_APP_PASSWORD: ${CLIENTPLATFORM_POSTGRES_APP_PASSWORD:?set CLIENTPLATFORM_POSTGRES_APP_PASSWORD}
    volumes:
      - clientplatform-postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-clientplatform-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientplatform_admin -d clientplatform"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  visual-provider-gateway:
    build:
      context: ../..
      dockerfile: visual_provider_gateway/Dockerfile
      args:
        VCS_REF: ${CLIENTPLATFORM_BUILD_VCS_REF:-unknown}
    image: clientplatform-production-visual-provider-gateway
    restart: unless-stopped
    env_file: ./clientplatform.env
    environment:
      VISUAL_GATEWAY_CLIENT_TOKENS_JSON: '{"clientplatform":"${VISUAL_GATEWAY_UPSTREAM_TOKEN:?set VISUAL_GATEWAY_UPSTREAM_TOKEN}"}'
      VISUAL_GATEWAY_DB: /data/visual_gateway.sqlite3
      VISUAL_CREATIVE_OUTPUT_DIR: /data/output
      VISUAL_CREATIVE_ENABLED: "1"
      VISUAL_DEPLOYMENT_COUNTRY: ${VISUAL_DEPLOYMENT_COUNTRY:-RU}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ${CLIENTPLATFORM_VISUAL_PROVIDER_DATA_DIR:-/opt/visual-creative-gateway/data}:/data
    expose: ["8097"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          payload=json.load(urllib.request.urlopen('http://127.0.0.1:8097/healthz',timeout=3));
          assert payload=={'ok':True}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  visual-gateway:
    build:
      context: ../..
      dockerfile: visual_gateway/Dockerfile
      args:
        VCS_REF: ${CLIENTPLATFORM_BUILD_VCS_REF:-unknown}
    image: clientplatform-production-visual-gateway
    restart: unless-stopped
    env_file: ./clientplatform.env
    environment:
      VISUAL_GATEWAY_STATE_DIR: /var/lib/visual-gateway
      VISUAL_GATEWAY_UPSTREAM_URL: http://visual-provider-gateway:8097
      VISUAL_GATEWAY_UPSTREAM_TOKEN: ${VISUAL_GATEWAY_UPSTREAM_TOKEN:?set VISUAL_GATEWAY_UPSTREAM_TOKEN}
    depends_on:
      visual-provider-gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - clientplatform-visual-gateway:/var/lib/visual-gateway
    expose: ["8080"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,os,urllib.request;
          token=os.environ['VISUAL_GATEWAY_TOKEN'];
          request=urllib.request.Request('http://127.0.0.1:8080/v1/capabilities',headers={'Authorization':'Bearer '+token});
          payload=json.load(urllib.request.urlopen(request,timeout=3));
          assert payload=={'contract_version':'1.0','capabilities':['generation','render_pack','usage'],'render_formats':['square','feed','story','landscape']}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  app:
    build:
      context: ../..
      dockerfile: deploy/clientplatform/Dockerfile
      args:
        CLIENTPLATFORM_REQUIRE_AUDIO_ASSETS: ${CLIENTPLATFORM_REQUIRE_AUDIO_ASSETS:-0}
    restart: unless-stopped
    env_file: ./clientplatform.env
    environment:
      DATABASE_URL: postgresql://clientplatform_app:${CLIENTPLATFORM_POSTGRES_APP_PASSWORD}@postgres:5432/clientplatform
      CLIENTPLATFORM_DATABASE_NAME: clientplatform
      CLIENTPLATFORM_DEPLOYMENT_MODE: container
      CLIENTPLATFORM_CONTAINER_NETWORK_ISOLATED: "1"
      MESSENGER_WEBHOOK_HOST: 0.0.0.0
      HEALTHCHECK_HOST: 0.0.0.0
      CLIENTPLATFORM_MEDIA_GATEWAY_HOST: 0.0.0.0
      VISUAL_GATEWAY_URL: http://visual-gateway:8080
    extra_hosts:
      - "api.telegram.org:${CLIENTPLATFORM_TELEGRAM_API_IPV4:-149.154.167.220}"
    depends_on:
      postgres:
        condition: service_healthy
      visual-gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - clientplatform-state:/var/lib/clientplatform
      - clientplatform-logs:/var/log/clientplatform
      - clientplatform-backups:/var/backups/clientplatform
      - ${CLIENTPLATFORM_AD_CREDENTIAL_HOST_DIR:-/var/lib/clientplatform/ad-secrets}:/run/secrets/clientplatform-ad:ro
      - ${CLIENTPLATFORM_MANAGED_BOT_CREDENTIAL_HOST_DIR:-/var/lib/clientplatform/managed-bot-secrets}:/run/secrets/clientplatform-managed-bot:ro
    expose: ["8181", "8182", "8191"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CLIENTPLATFORM_DOMAIN: ${CLIENTPLATFORM_DOMAIN:?set CLIENTPLATFORM_DOMAIN}
      CLIENTPLATFORM_INGRESS_UPSTREAM: app:8181
      CLIENTPLATFORM_MEDIA_UPSTREAM: app:8191
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - clientplatform-caddy-data:/data
      - clientplatform-caddy-config:/config
      - clientplatform-logs:/var/log/clientplatform
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on: [app]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  backup:
    profiles: ["operations"]
    build:
      context: ../..
      dockerfile: deploy/clientplatform/Dockerfile
      args:
        CLIENTPLATFORM_REQUIRE_AUDIO_ASSETS: "0"
    env_file: ./clientplatform.env
    environment:
      DATABASE_URL: postgresql://clientplatform_app:${CLIENTPLATFORM_POSTGRES_APP_PASSWORD}@postgres:5432/clientplatform
      CLIENTPLATFORM_DATABASE_NAME: clientplatform
    entrypoint: ["python", "-m", "scripts.clientplatform_postgres_backup_pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - clientplatform-backups:/var/backups/clientplatform
      - clientplatform-state:/var/lib/clientplatform
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  s3-replication:
    profiles: ["operations"]
    build:
      context: ../..
      dockerfile: deploy/clientplatform/Dockerfile
      args:
        CLIENTPLATFORM_REQUIRE_AUDIO_ASSETS: "0"
    env_file: ./clientplatform.env
    entrypoint: ["python", "scripts/clientplatform_s3_replication.py", "sync"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - clientplatform-state:/var/lib/clientplatform
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

networks:
  backend:
    internal: false

volumes:
  clientplatform-postgres:
  clientplatform-state:
  clientplatform-logs:
  clientplatform-backups:
  clientplatform-caddy-data:
  clientplatform-caddy-config:
  clientplatform-visual-gateway:
