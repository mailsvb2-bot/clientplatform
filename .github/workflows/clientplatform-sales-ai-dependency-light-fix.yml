name: ClientPlatform Sales AI Dependency-Light Fix

# Final integration pass: lazy provider imports + retention independence + draft freshness.
on:
  push:
    branches: [agent/integrate-sales-ai-v3]
    paths:
      - .github/workflows/clientplatform-sales-ai-dependency-light-fix.yml

permissions:
  contents: write

concurrency:
  group: clientplatform-sales-ai-dependency-light-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build clean candidate, prove canon contour, then push
        shell: bash
        run: |
          set -euo pipefail

          # Repair one temporary string-template docstring before parsing the helper.
          # This edits only the self-deleting helper, never a product file.
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/sales-ai-v3-fix-dependency-light.py')
          text = path.read_text(encoding='utf-8')
          old = '    """Fail closed if customer evidence or the canonical plan changed during drafting."""\n'
          new = '    # Fail closed if customer evidence or the canonical plan changed during drafting.\n'
          if text.count(old) != 1:
              raise SystemExit(f'SALES_AI_HELPER_REPAIR_FAILED:count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          # Apply the reviewed changes only inside this runner first.
          python3 .github/sales-ai-v3-fix-dependency-light.py
          python -m py_compile \
            clientplatform/infrastructure/sales_ai_provider.py \
            clientplatform/runtime/sales_ai.py \
            clientplatform/application/sales_ai_orchestration.py \
            clientplatform/application/sales_ai_drafts.py

          # Remove every temporary integration helper from the candidate tree.
          git config user.name 'ClientPlatform Integration Bot'
          git config user.email 'mailsvb2@gmail.com'
          git add \
            clientplatform/infrastructure/sales_ai_provider.py \
            clientplatform/runtime/sales_ai.py \
            clientplatform/application/sales_ai_orchestration.py \
            clientplatform/application/sales_ai_drafts.py
          git rm \
            .github/sales-ai-v3-fix-dependency-light.py \
            .github/workflows/clientplatform-sales-ai-dependency-light-fix.yml \
            .github/workflows/clientplatform-sales-ai-canon-diagnostic.yml
          git diff --cached --check
          git commit -m 'Harden Sales AI retention, freshness and dependency boundaries'

          # Canon contains production dirty-tree invariants. Run it only after the
          # candidate is a clean local commit; push happens strictly after success.
          test -z "$(git status --porcelain)"
          python - <<'PY'
          from __future__ import annotations
          import subprocess
          import sys
          from pathlib import Path

          runtime_tests = {
              "test_clientplatform_control_bot_behavior.py",
              "test_clientplatform_multi_lesson_program_builder.py",
              "test_clientplatform_yandex_cancel.py",
              "test_clientplatform_yandex_code_erasure.py",
              "test_clientplatform_yandex_screen_code.py",
              "test_clientplatform_yandex_screen_code_edges.py",
          }
          tests = [
              str(path)
              for path in sorted(Path("tests").glob("test_clientplatform_*.py"))
              if path.name not in runtime_tests
          ]
          raise SystemExit(
              subprocess.run([sys.executable, "-m", "unittest", "-v", *tests]).returncode
          )
          PY
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/integrate-sales-ai-v3
