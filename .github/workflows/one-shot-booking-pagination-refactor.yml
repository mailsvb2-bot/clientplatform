name: One-shot canonical booking pagination refactor

on:
  push:
    branches:
      - agent/paginate-booking-surfaces

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Apply fail-closed canonical refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(start) != 1 or text.count(end) < 1:
                  raise SystemExit(f"marker contract changed for {path}: {start!r} -> {end!r}")
              left, rest = text.split(start, 1)
              _old, right = rest.split(end, 1)
              target.write_text(left + replacement.rstrip() + "\n\n" + end + right, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exact import contract in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

