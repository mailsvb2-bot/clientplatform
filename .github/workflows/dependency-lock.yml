name: Dependency Lock

on:
  pull_request:
    paths:
      - 'requirements.in'
      - 'requirements-dev.in'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-py313.txt'
      - '.github/workflows/dependency-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    name: deterministic locks / py3.12+py3.13
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deterministic compiler for Python 3.12
        run: python -m pip install --disable-pip-version-check pip==26.1.2 pip-tools==7.5.3

      - name: Compile Python 3.12 hash locks
        run: |
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=requirements.txt --strip-extras requirements.in" \
            python -m piptools compile \
              --generate-hashes \
              --resolver=backtracking \
              --strip-extras \
              --output-file=requirements.txt \
              requirements.in
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=requirements-dev.txt --strip-extras requirements-dev.in" \
            python -m piptools compile \
              --generate-hashes \
              --resolver=backtracking \
              --strip-extras \
              --output-file=requirements-dev.txt \
              requirements-dev.in

      - name: Prove Python 3.12 runtime lock installation
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install deterministic compiler for Python 3.13
        run: python -m pip install --disable-pip-version-check pip==26.1.2 pip-tools==7.5.3

      - name: Compile Python 3.13 runtime hash lock
        run: |
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=requirements-py313.txt --strip-extras requirements.in" \
            python -m piptools compile \
              --generate-hashes \
              --resolver=backtracking \
              --strip-extras \
              --output-file=requirements-py313.txt \
              requirements.in

      - name: Prove Python 3.13 runtime lock installation
        run: python -m pip install --require-hashes -r requirements-py313.txt

      - name: Upload generated lock evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dependency-locks
          path: |
            requirements.txt
            requirements-dev.txt
            requirements-py313.txt
          if-no-files-found: error

      - name: Reject tracked or untracked lock drift
        run: |
          changes="$(git status --porcelain -- requirements.txt requirements-dev.txt requirements-py313.txt)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo 'DEPENDENCY_LOCK_DRIFT'
            exit 1
          fi
          echo 'DEPENDENCY_LOCK_CURRENT'
