name: Apply reward and probe fix

on:
  push:
    branches:
      - agent/fix-reward-engine-and-probe-cleanup

permissions:
  contents: write

concurrency:
  group: agent-fix-reward-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LOAD_DOTENV: '0'
      TELEGRAM_TRANSPORT: polling
      TELEGRAM_WEBHOOK_ENABLED: '0'
      TELEGRAM_LEGACY_TOKEN_WEBHOOK_ENABLED: '0'
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Apply exact production probe patch
        run: python .github/agent_patch_probe_cleanup.py

      - name: Compile changed Python surfaces
        run: |
          python -m py_compile \
            core/ai/reward_engine.py \
            scripts/probe_user_journey_e2e.py \
            tests/test_reward_engine_bounded_batch.py \
            tests/test_user_journey_cleanup_stability.py

      - name: Install hash-locked test dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_reward_engine_bounded_batch.py \
            tests/test_user_journey_cleanup_stability.py \
            tests/test_reward_scheduler_readiness_threshold.py

      - name: Remove one-shot patch infrastructure
        run: |
          rm -f .github/agent_patch_probe_cleanup.py
          rm -f .github/workflows/agent-fix-reward-probe.yml

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 1
          fi
          git commit -m "Fix reward scheduler bounds and probe cleanup race"
          git push origin "HEAD:${GITHUB_REF_NAME}"
