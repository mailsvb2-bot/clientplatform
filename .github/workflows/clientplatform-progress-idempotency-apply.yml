name: clientplatform Progress Idempotency Apply

on:
  push:
    branches:
      - agent/customer-program-progress

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/customer-program-progress
          fetch-depth: 1

      - name: Apply concurrent dispatch idempotency
        run: |
          set -Eeuo pipefail
          python scripts/.patch_progress_dispatch_idempotency.py
          rm -f scripts/.patch_progress_dispatch_idempotency.py
          rm -f .github/workflows/clientplatform-progress-idempotency-apply.yml
          python -m compileall -q clientplatform/infrastructure/customer_progress_repository.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make next lesson dispatch race-safe"
          git push origin HEAD:agent/customer-program-progress
