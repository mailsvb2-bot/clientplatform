name: Cockpit HTTP transport

on:
  push:
    branches:
      - feature/cockpit-automation-approvals
    paths:
      - .github/workflows/cockpit-http-transport.yml
      - .github/transport/cockpit_http.patch

permissions:
  contents: write

jobs:
  apply-exact-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: feature/cockpit-automation-approvals
          fetch-depth: 0

      - name: Apply and verify exact cockpit HTTP patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/transport/cockpit_http.patch
          git apply .github/transport/cockpit_http.patch
          test "$(git hash-object clientplatform/runtime/cockpit_http.py)" = "dfc1d9b0ae02982a91d2adb1a50983cf85fbd798"
          git diff --check

      - name: Commit exact verified file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clientplatform/runtime/cockpit_http.py
          git commit -m "Wire native cockpit automation HTTP surface [skip ci]"
          git push origin HEAD:feature/cockpit-automation-approvals
