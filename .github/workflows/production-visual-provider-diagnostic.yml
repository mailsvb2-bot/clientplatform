name: ClientPlatform Production Visual Provider Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: clientplatform-production-visual-provider-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-production-visual]')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_KNOWN_HOSTS }}
      SSH_PORT_SECRET: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_PORT }}

    steps:
      - name: Require dedicated ClientPlatform SSH credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?CLIENTPLATFORM_PRODUCTION_SSH_HOST is required}"
          : "${SSH_USER:?CLIENTPLATFORM_PRODUCTION_SSH_USER is required}"
          : "${SSH_PRIVATE_KEY:?CLIENTPLATFORM_PRODUCTION_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?CLIENTPLATFORM_PRODUCTION_SSH_KNOWN_HOSTS is required}"
          SSH_PORT="${SSH_PORT_SECRET:-22}"
          case "$SSH_PORT" in ''|*[!0-9]*) exit 2 ;; esac
          if [ "$SSH_PORT" -lt 1 ] || [ "$SSH_PORT" -gt 65535 ]; then exit 2; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Configure pinned production SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/clientplatform-production-ssh-key"
          known_hosts="$RUNNER_TEMP/clientplatform-production-known-hosts"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Probe live production visual provider state
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/clientplatform-production-ssh-key"
          known_hosts="$RUNNER_TEMP/clientplatform-production-known-hosts"
          output="$RUNNER_TEMP/clientplatform-production-visual-provider-diagnostic.log"

          set +e
          ssh \
            -p "$SSH_PORT" \
            -i "$key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" 'bash -s' 2>&1 <<'REMOTE' | tee "$output"
          set -Eeuo pipefail
          repo=/opt/clientplatform
          cd "$repo"

          privileged() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }

          provider_id="$(privileged docker ps --filter name=clientplatform-production-visual-provider-gateway-1 --format '{{.ID}}' | head -n1)"
          gateway_id="$(privileged docker ps --filter name=clientplatform-production-visual-gateway-1 --format '{{.ID}}' | head -n1)"
          app_id="$(privileged docker ps --filter name=clientplatform-production-app-1 --format '{{.ID}}' | head -n1)"
          if [ -z "$provider_id" ] || [ -z "$gateway_id" ] || [ -z "$app_id" ]; then
            echo "CLIENTPLATFORM_PRODUCTION_VISUAL_DIAGNOSTIC_FAILED:container_missing"
            exit 20
          fi

          provider_health="$(privileged docker inspect --format '{{.State.Health.Status}}' "$provider_id" 2>/dev/null || true)"
          gateway_health="$(privileged docker inspect --format '{{.State.Health.Status}}' "$gateway_id" 2>/dev/null || true)"
          app_health="$(privileged docker inspect --format '{{.State.Health.Status}}' "$app_id" 2>/dev/null || true)"
          echo "CLIENTPLATFORM_PRODUCTION_VISUAL_CONTAINERS provider_health=$provider_health gateway_health=$gateway_health app_health=$app_health head_sha=$(git rev-parse HEAD)"

          # Prove that production credentials are actually accepted by Yandex before
          # declaring the provider ready. Both probes use deliberately invalid bodies,
          # so an accepted credential returns 400/422 without starting a paid job.
          privileged docker exec -i "$provider_id" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request

          from services.yandex_iam_token import get_yandex_art_iam_token
          from visual_provider_gateway.engine import build_provider

          provider = build_provider("yandexart")
          primary = provider._primary_authorization()
          renewable_result = get_yandex_art_iam_token()
          renewable = (
              f"Bearer {renewable_result.token}"
              if renewable_result.available and renewable_result.token
              else ""
          )

          def probe(url: str, authorization: str, *, project: bool = False):
              if not authorization:
                  return "missing"
              headers = {
                  "Authorization": authorization,
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              }
              if project:
                  headers["OpenAI-Project"] = str(provider.config.folder_id or "")
              request = urllib.request.Request(
                  url,
                  data=b"{}",
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      return int(response.status)
              except urllib.error.HTTPError as exc:
                  return int(exc.code)
              except urllib.error.URLError as exc:
                  return "transport_" + type(exc.reason).__name__
              except TimeoutError:
                  return "transport_TimeoutError"
              except OSError as exc:
                  return "transport_" + type(exc).__name__

          base = provider.config.base_url.rstrip("/")
          paths = {
              "native": base + "/foundationModels/v1/imageGenerationAsync",
              "compat": base + "/v1/images/generations",
          }
          safe = {
              "primary_native": probe(paths["native"], primary),
              "primary_compat": probe(paths["compat"], primary, project=True),
              "renewable_native": probe(paths["native"], renewable),
              "renewable_compat": probe(paths["compat"], renewable, project=True),
              "renewable_configured": bool(renewable_result.configured),
              "renewable_available": bool(renewable_result.available),
              "renewable_auth_mode": str(renewable_result.auth_mode or ""),
              "renewable_error": str(renewable_result.error_code or ""),
          }

          key_path = str(
              os.environ.get("YANDEX_ART_AUTHORIZED_KEY_FILE")
              or os.environ.get("YANDEX_BILLING_AUTHORIZED_KEY_FILE")
              or ""
          ).strip()
          key_file = {
              "path_configured": bool(key_path),
              "exists": bool(key_path and os.path.exists(key_path)),
              "is_file": bool(key_path and os.path.isfile(key_path)),
              "size_bytes": 0,
              "json_valid_object": False,
              "json_keys": [],
          }
          if key_file["is_file"]:
              try:
                  raw_key = open(key_path, "rb").read(256 * 1024 + 1)
                  key_file["size_bytes"] = len(raw_key)
                  if len(raw_key) <= 256 * 1024:
                      parsed_key = json.loads(raw_key.decode("utf-8"))
                      if isinstance(parsed_key, dict):
                          key_file["json_valid_object"] = True
                          key_file["json_keys"] = sorted(
                              str(name)[:64] for name in parsed_key.keys()
                          )[:32]
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  pass
          safe["authorized_key_file"] = key_file

          print(
              "CLIENTPLATFORM_PRODUCTION_VISUAL_AUTH_PROBE "
              + json.dumps(safe, ensure_ascii=False, sort_keys=True)
          )
          accepted = {400, 422}
          if not any(
              safe[key] in accepted
              for key in (
                  "primary_native",
                  "primary_compat",
                  "renewable_native",
                  "renewable_compat",
              )
          ):
              raise SystemExit(29)
          PY

          privileged docker exec -i "$app_id" python - <<'PY'
          from __future__ import annotations

          import json
          import os

          from services import visual_creative_gateway as gateway

          payload = gateway._json("GET", "/v1/providers?country_code=RU")

          models = payload.get("models") if isinstance(payload.get("models"), dict) else {}
          yandex = models.get("yandexart") if isinstance(models.get("yandexart"), dict) else {}
          runtime = payload.get("runtime") if isinstance(payload.get("runtime"), dict) else {}
          image_runtime = runtime.get("image") if isinstance(runtime.get("image"), dict) else {}
          video_runtime = runtime.get("video") if isinstance(runtime.get("video"), dict) else {}
          circuits = runtime.get("circuits_open_seconds") if isinstance(runtime.get("circuits_open_seconds"), dict) else {}

          safe = {
              "enabled": bool(payload.get("enabled")),
              "country_code": str(payload.get("country_code") or ""),
              "image_order": list(payload.get("image_order") or ()),
              "video_order": list(payload.get("video_order") or ()),
              "configured_image": list(payload.get("configured_image") or ()),
              "configured_video": list(payload.get("configured_video") or ()),
              "configured_video_native": list(payload.get("configured_video_native") or ()),
              "configured_video_motion": list(payload.get("configured_video_motion") or ()),
              "video_generation_mode": str(payload.get("video_generation_mode") or ""),
              "yandex_model": str(yandex.get("model") or ""),
              "yandex_model_status": str(yandex.get("status") or ""),
              "yandex_catalog_configured": bool(yandex.get("catalog_configured")),
              "yandex_catalog_available": bool(yandex.get("catalog_available")),
              "yandex_catalog_error": str(yandex.get("catalog_error") or ""),
              "yandex_configured_model_present": bool(yandex.get("configured_model_present")),
              "yandex_available_art_models": list(yandex.get("available_art_models") or ()),
              "runtime_image_provider": str(image_runtime.get("provider") or ""),
              "runtime_image_error": str(image_runtime.get("error_code") or ""),
              "runtime_video_provider": str(video_runtime.get("provider") or ""),
              "runtime_video_error": str(video_runtime.get("error_code") or ""),
              "circuits_open_seconds": {str(k): int(v or 0) for k, v in circuits.items()},
              "credential_presence": {
                  "YANDEX_API_KEY": bool(os.environ.get("YANDEX_API_KEY")),
                  "YANDEX_ART_IAM_TOKEN": bool(os.environ.get("YANDEX_ART_IAM_TOKEN")),
                  "YANDEX_ART_AUTHORIZED_KEY_JSON": bool(os.environ.get("YANDEX_ART_AUTHORIZED_KEY_JSON")),
                  "YANDEX_ART_AUTHORIZED_KEY_FILE": bool(os.environ.get("YANDEX_ART_AUTHORIZED_KEY_FILE")),
                  "YANDEX_BILLING_AUTHORIZED_KEY_JSON": bool(os.environ.get("YANDEX_BILLING_AUTHORIZED_KEY_JSON")),
                  "YANDEX_BILLING_AUTHORIZED_KEY_FILE": bool(os.environ.get("YANDEX_BILLING_AUTHORIZED_KEY_FILE")),
                  "YANDEX_ART_FOLDER_ID": bool(os.environ.get("YANDEX_ART_FOLDER_ID")),
                  "VISUAL_SELFHOST_BASE_URL": bool(os.environ.get("VISUAL_SELFHOST_BASE_URL")),
                  "VISUAL_SELFHOST_VIDEO_MODEL": bool(os.environ.get("VISUAL_SELFHOST_VIDEO_MODEL")),
                  "VISUAL_SELFHOST_BACKUP_BASE_URL": bool(os.environ.get("VISUAL_SELFHOST_BACKUP_BASE_URL")),
                  "RUNWAYML_API_SECRET": bool(os.environ.get("RUNWAYML_API_SECRET")),
                  "VISUAL_OPENAI_API_KEY": bool(os.environ.get("VISUAL_OPENAI_API_KEY")),
              },
          }
          print("CLIENTPLATFORM_PRODUCTION_VISUAL_SNAPSHOT " + json.dumps(safe, ensure_ascii=False, sort_keys=True))
          readiness = (
              "ready"
              if (
                  safe["enabled"]
                  and safe["configured_image"]
                  and safe["configured_video"]
                  and not safe["runtime_image_error"]
                  and not safe["runtime_video_error"]
              )
              else "provider_unavailable"
          )
          print("CLIENTPLATFORM_PRODUCTION_VISUAL_READINESS state=" + readiness)
          # Diagnostic branch: continue after provider_unavailable so we can
          # inspect safe recent-job metadata without mutating production.
          PY

          privileged docker exec -i "$provider_id" python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import sqlite3
          import time

          credential_presence = {
              "YANDEX_MODEL_CATALOG_API_KEY": bool(os.environ.get("YANDEX_MODEL_CATALOG_API_KEY")),
              "YANDEX_MODEL_CATALOG_AUTH_SCHEME": bool(os.environ.get("YANDEX_MODEL_CATALOG_AUTH_SCHEME")),
              "YANDEX_ART_AUTHORIZED_KEY_JSON": bool(os.environ.get("YANDEX_ART_AUTHORIZED_KEY_JSON")),
              "YANDEX_ART_AUTHORIZED_KEY_FILE": bool(os.environ.get("YANDEX_ART_AUTHORIZED_KEY_FILE")),
              "YANDEX_BILLING_AUTHORIZED_KEY_JSON": bool(os.environ.get("YANDEX_BILLING_AUTHORIZED_KEY_JSON")),
              "YANDEX_BILLING_AUTHORIZED_KEY_FILE": bool(os.environ.get("YANDEX_BILLING_AUTHORIZED_KEY_FILE")),
          }
          print(
              "CLIENTPLATFORM_PRODUCTION_VISUAL_PROVIDER_CREDENTIAL_PRESENCE "
              + json.dumps(credential_presence, ensure_ascii=False, sort_keys=True)
          )

          db_path = str(os.environ.get("VISUAL_GATEWAY_DB") or "/data/visual_gateway.sqlite3")
          now = int(time.time())
          safe_rows = []
          counts = {}

          def safe_error_code(value: object) -> str:
              raw = str(value or "").strip()
              if not raw:
                  return ""
              if not re.fullmatch(r"[a-z0-9_]{1,96}", raw):
                  return "redacted_untrusted_error"
              trusted_prefixes = (
                  "visual_",
                  "yandex_",
                  "runway_",
                  "openai_",
                  "selfhosted_",
                  "provider_",
                  "creative_",
                  "no_visual_",
              )
              return raw if raw.startswith(trusted_prefixes) else "redacted_untrusted_error"
          with sqlite3.connect(db_path) as conn:
              conn.row_factory = sqlite3.Row
              rows = conn.execute(
                  """
                  SELECT kind,status,provider,model,error_code,created_at,updated_at,asset_path
                  FROM visual_jobs
                  WHERE client_id='clientplatform'
                  ORDER BY updated_at DESC
                  LIMIT 20
                  """
              ).fetchall()
              for row in rows:
                  kind = str(row["kind"] or "")
                  status = str(row["status"] or "")
                  provider = str(row["provider"] or "")
                  error_code = safe_error_code(row["error_code"])
                  key = f"{kind}:{status}:{provider or 'none'}:{error_code or 'none'}"
                  counts[key] = counts.get(key, 0) + 1
                  asset_path = str(row["asset_path"] or "")
                  asset_exists = bool(asset_path and os.path.isfile(asset_path))
                  asset_size = (
                      int(os.path.getsize(asset_path))
                      if asset_exists
                      else 0
                  )
                  safe_rows.append(
                      {
                          "kind": kind,
                          "status": status,
                          "provider": provider,
                          "model_recorded": bool(str(row["model"] or "").strip()),
                          "error_code": error_code,
                          "age_seconds": max(0, now - int(row["updated_at"] or row["created_at"] or now)),
                          "asset_exists": asset_exists,
                          "asset_size_bytes": asset_size,
                      }
                  )

          print(
              "CLIENTPLATFORM_PRODUCTION_VISUAL_RECENT_JOB_COUNTS "
              + json.dumps(counts, ensure_ascii=False, sort_keys=True)
          )
          print(
              "CLIENTPLATFORM_PRODUCTION_VISUAL_RECENT_JOBS "
              + json.dumps(safe_rows, ensure_ascii=False, sort_keys=True)
          )
          PY

          privileged docker exec -i "$app_id" python - <<'PY'
          from __future__ import annotations
          import json, time
          from clientplatform.application.visual_creatives import (
              _load_frozen_business_visual_payload,
          )
          from services.db import get_db_ro
          from visual_provider_gateway.models import CreativeBrief
          from visual_provider_gateway.prompt_adapter import adapt_visual_brief_for_provider
          from visual_provider_gateway.providers import _openai_image_size

          safe = {"found": False}
          try:
              with get_db_ro() as conn:
                  row = conn.execute(
                      """
                      SELECT provider_payload_json,status,created_at,updated_at
                      FROM creative_generation_receipts
                      ORDER BY updated_at DESC LIMIT 1
                      """
                  ).fetchone()
              if row is not None:
                  raw_payload = str(row["provider_payload_json"] if hasattr(row, "keys") else row[0])
                  brief, wait_seconds = _load_frozen_business_visual_payload(raw_payload)
                  provider_brief = adapt_visual_brief_for_provider(
                      CreativeBrief(
                          kind=brief.kind,
                          prompt=brief.prompt,
                          country_code=brief.country_code,
                          preferred_provider=brief.preferred_provider,
                          aspect_ratio=brief.aspect_ratio,
                          duration_seconds=brief.duration_seconds,
                          negative_prompt=brief.negative_prompt,
                          reference_url=brief.reference_url,
                          brand_context=brief.brand_context,
                          seed=brief.seed,
                      ),
                      provider="yandexart",
                  )
                  safe = {
                      "found": True,
                      "status": str(row["status"] if hasattr(row, "keys") else row[1]),
                      "kind": str(brief.kind),
                      "aspect_ratio": str(brief.aspect_ratio),
                      "images_api_size": _openai_image_size(brief.aspect_ratio),
                      "wait_seconds": int(wait_seconds),
                      "compiled_prompt_chars": len(str(brief.prompt or "")),
                      "compiled_prompt_utf8_bytes": len(str(brief.prompt or "").encode("utf-8")),
                      "yandex_prompt_chars": len(str(provider_brief.prompt or "")),
                      "yandex_prompt_utf8_bytes": len(str(provider_brief.prompt or "").encode("utf-8")),
                      "yandex_prompt_lines": len([x for x in str(provider_brief.prompt or "").splitlines() if x.strip()]),
                      "negative_prompt_present": bool(str(brief.negative_prompt or "").strip()),
                      "preferred_provider_present": bool(str(brief.preferred_provider or "").strip()),
                  }
          except Exception as exc:
              safe = {"found": False, "diagnostic_error_type": type(exc).__name__}
          print("CLIENTPLATFORM_PRODUCTION_VISUAL_LATEST_RECEIPT_META " + json.dumps(safe, sort_keys=True))
          PY


          probe_ref="$(privileged docker exec -i "$provider_id" python - <<'PY'
          from __future__ import annotations

          import os
          import re
          import sqlite3
          import sys
          import time
          from pathlib import Path

          db_path = str(os.environ.get("VISUAL_GATEWAY_DB") or "/data/visual_gateway.sqlite3")
          output_root = Path(os.environ.get("VISUAL_CREATIVE_OUTPUT_DIR") or "/data/output").expanduser().resolve()
          try:
              ttl = int(str(os.environ.get("VISUAL_TRANSIENT_ASSET_TTL_SECONDS") or "21600"))
          except ValueError:
              ttl = 21600
          ttl = max(300, min(ttl, 86400))
          cutoff = time.time() - ttl
          with sqlite3.connect(db_path) as conn:
              conn.row_factory = sqlite3.Row
              rows = conn.execute(
                  """
                  SELECT id,scope_id,asset_path
                  FROM visual_jobs
                  WHERE client_id='clientplatform'
                    AND kind='image'
                    AND status='succeeded'
                    AND asset_path<>''
                  ORDER BY updated_at DESC
                  LIMIT 20
                  """
              ).fetchall()
          row = None
          for candidate_row in rows:
              path = Path(str(candidate_row["asset_path"] or "")).expanduser().resolve()
              try:
                  path.relative_to(output_root)
              except ValueError:
                  continue
              try:
                  stat = path.stat()
              except OSError:
                  continue
              if not path.is_file() or stat.st_mtime <= cutoff:
                  continue
              row = candidate_row
              break
          if row is None:
              sys.stdout.write("\n\n")
              raise SystemExit(0)
          job_id = str(row["id"] or "").strip()
          scope_id = str(row["scope_id"] or "").strip()
          if re.fullmatch(r"[A-Za-z0-9_-]{1,128}", job_id) is None:
              raise SystemExit(32)
          if re.fullmatch(r"[A-Za-z0-9_.:@/-]{1,160}", scope_id) is None:
              raise SystemExit(33)
          sys.stdout.write(job_id + "\n" + scope_id + "\n")
          PY
          )"
          job_id="$(printf '%s\n' "$probe_ref" | sed -n '1p')"
          scope_id="$(printf '%s\n' "$probe_ref" | sed -n '2p')"
          if [[ ! "$job_id" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || [[ ! "$scope_id" =~ ^[A-Za-z0-9_.:@/-]{1,160}$ ]]; then
            echo "CLIENTPLATFORM_PRODUCTION_VISUAL_CONTENT_CHAIN state=no_retained_asset"
            exit 0
          fi

          privileged docker exec \
            -e CLIENTPLATFORM_PROBE_JOB_ID="$job_id" \
            -e CLIENTPLATFORM_PROBE_SCOPE_ID="$scope_id" \
            -i "$provider_id" python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request

          job_id = os.environ["CLIENTPLATFORM_PROBE_JOB_ID"]
          scope_id = os.environ["CLIENTPLATFORM_PROBE_SCOPE_ID"]
          token = str(os.environ.get("VISUAL_GATEWAY_UPSTREAM_TOKEN") or "")
          query = urllib.parse.urlencode({"scope_id": scope_id})
          request = urllib.request.Request(
              f"http://127.0.0.1:8097/v1/creative/generations/{urllib.parse.quote(job_id, safe='')}/content?{query}",
              headers={"Authorization": "Bearer " + token},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              raw = response.read(32 * 1024 * 1024 + 1)
              content_type = str(response.headers.get("Content-Type") or "").split(";", 1)[0].strip().lower()
              status = int(response.status)
          if len(raw) > 32 * 1024 * 1024:
              raise SystemExit(35)
          signature = (
              "jpeg" if raw.startswith(b"\xff\xd8\xff")
              else "png" if raw.startswith(b"\x89PNG\r\n\x1a\n")
              else "webp" if len(raw) >= 12 and raw[:4] == b"RIFF" and raw[8:12] == b"WEBP"
              else "unknown"
          )
          print(
              "CLIENTPLATFORM_PRODUCTION_VISUAL_PROVIDER_CONTENT_CHAIN "
              + json.dumps(
                  {
                      "http_status": status,
                      "bytes": len(raw),
                      "content_type": content_type,
                      "signature": signature,
                      "sha256_recorded": bool(hashlib.sha256(raw).hexdigest()),
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          PY

          privileged docker exec \
            -e CLIENTPLATFORM_PROBE_JOB_ID="$job_id" \
            -e CLIENTPLATFORM_PROBE_SCOPE_ID="$scope_id" \
            -i "$app_id" python - <<'PY'
          from __future__ import annotations

          import io
          import json
          import os
          import urllib.parse
          import urllib.request

          from PIL import Image

          job_id = os.environ["CLIENTPLATFORM_PROBE_JOB_ID"]
          scope_id = os.environ["CLIENTPLATFORM_PROBE_SCOPE_ID"]
          base = str(os.environ.get("VISUAL_GATEWAY_URL") or "").rstrip("/")
          token = str(os.environ.get("VISUAL_GATEWAY_TOKEN") or "")
          query = urllib.parse.urlencode({"scope_id": scope_id})
          request = urllib.request.Request(
              base + f"/v1/creative/generations/{urllib.parse.quote(job_id, safe='')}/content?{query}",
              headers={"Authorization": "Bearer " + token},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              raw = response.read(32 * 1024 * 1024 + 1)
              content_type = str(response.headers.get("Content-Type") or "").split(";", 1)[0].strip().lower()
              status = int(response.status)
          if len(raw) > 32 * 1024 * 1024:
              raise SystemExit(36)
          decode_ok = False
          image_format = ""
          width = 0
          height = 0
          try:
              with Image.open(io.BytesIO(raw)) as opened:
                  image_format = str(opened.format or "").upper()
                  width, height = map(int, opened.size)
                  opened.verify()
              decode_ok = True
          except Exception:
              decode_ok = False
          print(
              "CLIENTPLATFORM_PRODUCTION_VISUAL_APP_CONTENT_CHAIN "
              + json.dumps(
                  {
                      "http_status": status,
                      "bytes": len(raw),
                      "content_type": content_type,
                      "decode_ok": decode_ok,
                      "image_format": image_format,
                      "width": width,
                      "height": height,
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          if not decode_ok:
              raise SystemExit(37)
          PY
          REMOTE
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            marker="$(grep -E '^CLIENTPLATFORM_PRODUCTION_VISUAL_DIAGNOSTIC_FAILED:' "$output" | tail -n1 || true)"
            [ -n "$marker" ] || marker="CLIENTPLATFORM_PRODUCTION_VISUAL_DIAGNOSTIC_FAILED:probe_failed_without_safe_marker"
            echo "failure_marker=$marker" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
          if grep -q '^CLIENTPLATFORM_PRODUCTION_VISUAL_CONTENT_CHAIN state=no_retained_asset$' "$output"; then
            echo "asset_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "asset_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrieve latest successful production image asset
        if: steps.probe.outcome == 'success' && steps.probe.outputs.asset_available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/clientplatform-production-ssh-key"
          known_hosts="$RUNNER_TEMP/clientplatform-production-known-hosts"
          asset="$RUNNER_TEMP/clientplatform-latest-production-image"
          ssh \
            -p "$SSH_PORT" \
            -i "$key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" 'bash -s' > "$asset" <<'REMOTE'
          set -Eeuo pipefail
          privileged() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }
          provider_id="$(privileged docker ps --filter name=clientplatform-production-visual-provider-gateway-1 --format '{{.ID}}' | head -n1)"
          app_id="$(privileged docker ps --filter name=clientplatform-production-app-1 --format '{{.ID}}' | head -n1)"
          [ -n "$provider_id" ] && [ -n "$app_id" ]
          host_asset="$(mktemp /tmp/clientplatform-production-image.XXXXXX)"
          validated_asset="$(mktemp /tmp/clientplatform-production-image-validated.XXXXXX)"
          cleanup() {
            rm -f -- "$host_asset" "$validated_asset"
          }
          trap cleanup EXIT

          privileged docker exec -i "$provider_id" python - <<'PY' > "$host_asset"
          from __future__ import annotations
          import os
          import sqlite3
          import sys
          from pathlib import Path

          db_path = str(os.environ.get("VISUAL_GATEWAY_DB") or "/data/visual_gateway.sqlite3")
          output_root = Path(os.environ.get("VISUAL_CREATIVE_OUTPUT_DIR") or "/data/output").expanduser().resolve()
          with sqlite3.connect(db_path) as conn:
              conn.row_factory = sqlite3.Row
              row = conn.execute(
                  """
                  SELECT asset_path
                  FROM visual_jobs
                  WHERE client_id='clientplatform'
                    AND kind='image'
                    AND status='succeeded'
                    AND asset_path<>''
                  ORDER BY updated_at DESC
                  LIMIT 1
                  """
              ).fetchone()
          if row is None:
              raise SystemExit(41)
          path = Path(str(row["asset_path"] or "")).expanduser().resolve()
          try:
              path.relative_to(output_root)
          except ValueError:
              raise SystemExit(42)
          if not path.is_file():
              raise SystemExit(43)
          raw = path.read_bytes()
          if not raw or len(raw) > 32 * 1024 * 1024:
              raise SystemExit(44)
          sys.stdout.buffer.write(raw)
          PY
          test -s "$host_asset"
          validator_code="$(cat <<'PY'
          import io
          import sys
          from PIL import Image, UnidentifiedImageError

          raw = sys.stdin.buffer.read(32 * 1024 * 1024 + 1)
          if not raw or len(raw) > 32 * 1024 * 1024:
              raise SystemExit(45)
          try:
              with Image.open(io.BytesIO(raw)) as opened:
                  if str(opened.format or "").upper() not in {"JPEG", "PNG", "WEBP"}:
                      raise SystemExit(46)
                  width, height = map(int, opened.size)
                  if width < 64 or height < 64:
                      raise SystemExit(47)
                  opened.verify()
          except (OSError, UnidentifiedImageError):
              raise SystemExit(48)
          sys.stdout.buffer.write(raw)
          PY
          )"
          privileged docker exec -i "$app_id" python -c "$validator_code" < "$host_asset" > "$validated_asset"
          test -s "$validated_asset"
          cmp -s "$host_asset" "$validated_asset"
          cat "$validated_asset"
          REMOTE
          test -s "$asset"
          python - "$asset" <<'PY'
          from __future__ import annotations
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          raw = path.read_bytes()
          if raw.startswith(b"\xff\xd8\xff"):
              fmt, suffix = "JPEG", ".jpg"
          elif raw.startswith(b"\x89PNG\r\n\x1a\n"):
              fmt, suffix = "PNG", ".png"
          elif len(raw) >= 12 and raw[:4] == b"RIFF" and raw[8:12] == b"WEBP":
              fmt, suffix = "WEBP", ".webp"
          else:
              raise SystemExit(48)
          target = path.with_suffix(suffix)
          path.replace(target)
          print(f"CLIENTPLATFORM_PRODUCTION_VISUAL_ASSET_EXPORTED bytes={target.stat().st_size} format={fmt}")
          PY

      - name: Upload latest production image asset
        if: steps.probe.outcome == 'success' && steps.probe.outputs.asset_available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-latest-image-asset
          path: ${{ runner.temp }}/clientplatform-latest-production-image.*
          if-no-files-found: error
          retention-days: 1

      - name: Upload safe diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-visual-provider-diagnostic
          path: ${{ runner.temp }}/clientplatform-production-visual-provider-diagnostic.log
          if-no-files-found: warn

      - name: Publish production visual diagnostic status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          FAILURE_MARKER: ${{ steps.probe.outputs.failure_marker }}
        with:
          script: |
            const ok = process.env.PROBE_OUTCOME === 'success';
            const marker = process.env.FAILURE_MARKER || 'production visual provider diagnostic failed';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'ops/clientplatform-production-visual-provider',
              description: (ok ? 'Production visual app-facing diagnostic completed' : marker).slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });