name: clientplatform Canon

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  canon:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify clientplatform canon and provenance
        run: python scripts/check_clientplatform_canon.py

      - name: Verify dependency-light clientplatform boundaries
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          import sys
          from pathlib import Path

          runtime_tests = {
              "test_clientplatform_control_bot_behavior.py",
              "test_clientplatform_multi_lesson_program_builder.py",
              "test_clientplatform_yandex_cancel.py",
              "test_clientplatform_yandex_code_erasure.py",
              "test_clientplatform_yandex_screen_code.py",
              "test_clientplatform_yandex_screen_code_edges.py",
          }
          tests = [
              str(path)
              for path in sorted(Path("tests").glob("test_clientplatform_*.py"))
              if path.name not in runtime_tests
          ]
          if not tests:
              raise SystemExit("No dependency-light ClientPlatform tests found")
          subprocess.run(
              [sys.executable, "-m", "unittest", "-v", *tests],
              check=True,
          )
          PY

      - name: Verify ClientPlatform product purity
        run: python scripts/check_clientplatform_product_purity.py

      - name: Reject tracked raw secrets
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)\.env$|(^|/)id_rsa$|\.(pem|p12|pfx|key)$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Forbidden secret-like files are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Verify imported baseline remains documented
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'b4ac43c2961fb581078aedc25efeffd2ab4ecb34' docs/BASELINE_PROVENANCE.md
          grep -Fq 'mailsvb2-bot/clientplatform' docs/BASELINE_PROVENANCE.md
