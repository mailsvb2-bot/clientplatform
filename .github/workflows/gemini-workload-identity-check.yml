name: Gemini workload identity readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gemini-workload-identity-check.yml'
      - 'docs/gemini-workload-identity.md'

permissions:
  contents: read
  id-token: write

jobs:
  gemini-auth-readiness:
    name: Gemini WIF readiness
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration presence
        env:
          GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          test -n "$GOOGLE_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GOOGLE_SERVICE_ACCOUNT"
          echo "Google Workload Identity configuration is present."

      - name: Authenticate to Google Cloud through GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - name: Verify identity
        run: gcloud auth list
