name: A1 Telegram Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-telegram-staging
  cancel-in-progress: false

jobs:
  media-delivery-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: a1-staging

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Probe signed gateway and send real Telegram audio
        env:
          A1_SECRET_STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.A1_STAGING_TELEGRAM_BOT_TOKEN }}
          A1_STAGING_TELEGRAM_CHAT_ID: ${{ secrets.A1_STAGING_TELEGRAM_CHAT_ID }}
          A1_MEDIA_GATEWAY_BASE_URL: ${{ vars.A1_MEDIA_GATEWAY_BASE_URL }}
          A1_STAGING_MEDIA_REFERENCE: ${{ vars.A1_STAGING_MEDIA_REFERENCE }}
          A1_SECRET_MEDIA_SIGNING_KEY: ${{ secrets.A1_MEDIA_SIGNING_KEY }}
          A1_TELEGRAM_API_BASE_URL: ${{ vars.A1_TELEGRAM_API_BASE_URL }}
        run: python scripts/a1_telegram_staging_smoke.py
