name: ClientPlatform Sales AI Canon Diagnostic

on:
  push:
    branches: [agent/integrate-sales-ai-v3]
    paths:
      - .github/workflows/clientplatform-sales-ai-canon-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Capture dependency-light failures as annotations
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/canon.log 2>&1
          from __future__ import annotations
          import subprocess
          import sys
          from pathlib import Path
          runtime_tests = {
              "test_clientplatform_control_bot_behavior.py",
              "test_clientplatform_multi_lesson_program_builder.py",
              "test_clientplatform_yandex_cancel.py",
              "test_clientplatform_yandex_code_erasure.py",
              "test_clientplatform_yandex_screen_code.py",
              "test_clientplatform_yandex_screen_code_edges.py",
          }
          tests = [
              str(path)
              for path in sorted(Path("tests").glob("test_clientplatform_*.py"))
              if path.name not in runtime_tests
          ]
          raise SystemExit(subprocess.run([sys.executable, "-m", "unittest", "-v", *tests]).returncode)
          PY
          rc=$?
          if [ "$rc" -ne 0 ]; then
            tail -n 140 /tmp/canon.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | while IFS= read -r line; do
              echo "::error file=tests,title=Sales AI canon diagnostic::$line"
            done
          fi
          exit "$rc"
