name: ClientPlatform Sales AI Canon Diagnostic

on:
  push:
    branches: [agent/integrate-sales-ai-v3]
    paths:
      - .github/workflows/clientplatform-sales-ai-canon-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Apply staged lazy-import fix and capture provider-test failure
        shell: bash
        run: |
          set +e
          python3 .github/sales-ai-v3-fix-dependency-light.py > /tmp/patch.log 2>&1
          patch_rc=$?
          if [ "$patch_rc" -ne 0 ]; then
            cat /tmp/patch.log | while IFS= read -r line; do
              echo "::error file=clientplatform/infrastructure/sales_ai_provider.py,title=Sales AI patch diagnostic::$line"
            done
            exit "$patch_rc"
          fi
          python -m unittest -v tests.test_clientplatform_sales_ai_provider > /tmp/canon.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            tail -n 180 /tmp/canon.log | while IFS= read -r line; do
              echo "::error file=tests/test_clientplatform_sales_ai_provider.py,title=Sales AI provider diagnostic::$line"
            done
          fi
          exit "$rc"
