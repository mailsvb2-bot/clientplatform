name: clientplatform Telegram Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientplatform-telegram-staging
  cancel-in-progress: false

jobs:
  media-delivery-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: clientplatform_bot

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Require dedicated staging bot token
        env:
          CLIENTPLATFORM_SECRET_STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.CLIENTPLATFORM_STAGING_TELEGRAM_BOT_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "$CLIENTPLATFORM_SECRET_STAGING_TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Add CLIENTPLATFORM_STAGING_TELEGRAM_BOT_TOKEN to the clientplatform_bot environment."
            exit 1
          fi

      - name: Prepare isolated media and signing key
        run: |
          set -Eeuo pipefail
          MEDIA_ROOT="$RUNNER_TEMP/clientplatform-staging-media"
          FIXTURE="$MEDIA_ROOT/clientplatform-staging/fixture.mp3"
          python -m scripts.clientplatform_staging_fixture "$FIXTURE"

          SIGNING_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$SIGNING_KEY"
          {
            echo "CLIENTPLATFORM_SECRET_MEDIA_SIGNING_KEY=$SIGNING_KEY"
            echo "CLIENTPLATFORM_MEDIA_GATEWAY_FILESYSTEM_ROOT=$MEDIA_ROOT"
            echo "CLIENTPLATFORM_MEDIA_GATEWAY_ALLOWED_BUCKETS=clientplatform-staging"
            echo "CLIENTPLATFORM_MEDIA_GATEWAY_PORT=8091"
            echo "CLIENTPLATFORM_STAGING_MEDIA_REFERENCE=s3://clientplatform-staging/fixture.mp3"
          } >> "$GITHUB_ENV"

      - name: Start loopback media gateway
        run: |
          set -Eeuo pipefail
          nohup python -m scripts.clientplatform_ephemeral_media_gateway \
            > "$RUNNER_TEMP/clientplatform-gateway.log" 2>&1 &
          GATEWAY_PID="$!"
          echo "$GATEWAY_PID" > "$RUNNER_TEMP/clientplatform-gateway.pid"
          export CLIENTPLATFORM_GATEWAY_PID="$GATEWAY_PID"

          python - <<'PY'
          import os
          import socket
          import time
          from pathlib import Path

          port = int(os.environ["CLIENTPLATFORM_MEDIA_GATEWAY_PORT"])
          pid = int(os.environ["CLIENTPLATFORM_GATEWAY_PID"])
          log_path = Path(os.environ["RUNNER_TEMP"]) / "clientplatform-gateway.log"
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  os.kill(pid, 0)
              except ProcessLookupError:
                  detail = log_path.read_text(errors="replace") if log_path.exists() else ""
                  raise SystemExit(
                      "clientplatform loopback gateway process exited before readiness\n"
                      + detail
                  )
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=1):
                      print(f"clientplatform loopback gateway is accepting connections on {port}")
                      break
              except OSError:
                  time.sleep(0.25)
          else:
              detail = log_path.read_text(errors="replace") if log_path.exists() else ""
              raise SystemExit(
                  "clientplatform loopback gateway did not start\n" + detail
              )
          PY

      - name: Install pinned Cloudflare tunnel client
        run: |
          set -Eeuo pipefail
          CLOUDFLARED="$RUNNER_TEMP/cloudflared"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$CLOUDFLARED" \
            "https://github.com/cloudflare/cloudflared/releases/download/2026.7.3/cloudflared-linux-amd64"
          echo "9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17  $CLOUDFLARED" \
            | sha256sum --check --strict
          chmod 0755 "$CLOUDFLARED"

      - name: Expose gateway through temporary HTTPS tunnel
        run: |
          set -Eeuo pipefail
          TUNNEL_HOME="$RUNNER_TEMP/cloudflared-home"
          mkdir -p "$TUNNEL_HOME"
          HOME="$TUNNEL_HOME" nohup "$RUNNER_TEMP/cloudflared" tunnel \
            --no-autoupdate \
            --url "http://127.0.0.1:$CLIENTPLATFORM_MEDIA_GATEWAY_PORT" \
            --logfile "$RUNNER_TEMP/cloudflared.log" \
            --loglevel info \
            > "$RUNNER_TEMP/cloudflared.stdout.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cloudflared.pid"

          python - <<'PY'
          import os
          import re
          import time
          from pathlib import Path

          pattern = re.compile(r"https://[a-z0-9-]+\.trycloudflare\.com")
          files = (
              Path(os.environ["RUNNER_TEMP"]) / "cloudflared.log",
              Path(os.environ["RUNNER_TEMP"]) / "cloudflared.stdout.log",
          )
          deadline = time.monotonic() + 60
          public_url = ""
          while time.monotonic() < deadline and not public_url:
              for path in files:
                  if not path.exists():
                      continue
                  match = pattern.search(path.read_text(errors="replace"))
                  if match:
                      public_url = match.group(0)
                      break
              if not public_url:
                  time.sleep(0.5)
          if not public_url:
              raise SystemExit("Cloudflare Quick Tunnel URL was not created")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write(
                  f"CLIENTPLATFORM_MEDIA_GATEWAY_BASE_URL={public_url}/clientplatform\n"
              )
          print("Temporary HTTPS gateway is ready")
          PY

      - name: Probe gateway and send real Telegram audio
        env:
          CLIENTPLATFORM_SECRET_STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.CLIENTPLATFORM_STAGING_TELEGRAM_BOT_TOKEN }}
          CLIENTPLATFORM_STAGING_TELEGRAM_CHAT_ID: ${{ secrets.CLIENTPLATFORM_STAGING_TELEGRAM_CHAT_ID }}
        run: python -m scripts.clientplatform_telegram_staging_smoke

      - name: Stop ephemeral processes
        if: always()
        run: |
          for pid_file in \
            "$RUNNER_TEMP/cloudflared.pid" \
            "$RUNNER_TEMP/clientplatform-gateway.pid"
          do
            if [ -s "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

      - name: Upload staging diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clientplatform-telegram-staging-diagnostics
          path: |
            ${{ runner.temp }}/clientplatform-gateway.log
            ${{ runner.temp }}/cloudflared.log
            ${{ runner.temp }}/cloudflared.stdout.log
          if-no-files-found: warn
