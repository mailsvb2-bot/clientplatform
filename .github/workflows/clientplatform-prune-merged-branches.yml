name: ClientPlatform Prune Merged Branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clientplatform-prune-merged-branches.yml

permissions:
  contents: write

concurrency:
  group: clientplatform-prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'mailsvb2-bot/clientplatform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete reviewed agent branches and prove only main remains
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          mapfile -t branches < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
            | grep -vE '^(HEAD|main)$' \
            | sort
          )

          unexpected=()
          for branch in "${branches[@]}"; do
            case "${branch}" in
              agent/*) ;;
              *) unexpected+=("${branch}") ;;
            esac
          done

          if ((${#unexpected[@]} > 0)); then
            printf 'CLIENTPLATFORM_BRANCH_PRUNE_FAILED:unexpected_branch:%s\n' \
              "${unexpected[*]}" >&2
            exit 1
          fi

          printf 'CLIENTPLATFORM_BRANCH_PRUNE_REVIEWED_COUNT:%s\n' \
            "${#branches[@]}"

          for branch in "${branches[@]}"; do
            printf 'Deleting reviewed branch: %s\n' "${branch}"
            git push origin --delete "${branch}"
          done

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t remaining < <(
            git for-each-ref \
              --format='%(refname:strip=3)' \
              refs/remotes/origin \
            | grep -v '^HEAD$' \
            | sort
          )

          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != 'main' ]]; then
            printf 'CLIENTPLATFORM_BRANCH_PRUNE_FAILED:remaining:%s\n' \
              "${remaining[*]}" >&2
            exit 1
          fi

          printf 'CLIENTPLATFORM_BRANCH_PRUNE_OK:main\n'
