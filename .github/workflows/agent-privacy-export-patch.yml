name: One-shot privacy export hardening

on:
  push:
    branches:
      - agent/harden-user-data-export
    paths:
      - tools/agent_patch_privacy_export.py
      - .github/workflows/agent-privacy-export-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/harden-user-data-export
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Apply exact patch and focused tests
        run: python tools/agent_patch_privacy_export.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handlers/info.py services/privacy_controls.py services/messenger/text_ui_router.py services/messenger/reply_dispatcher.py tests/test_privacy_user_commands.py tests/test_privacy_payment_runtime_followup.py tests/test_privacy_streaming_export.py
          git diff --cached --check
          git commit -m "Harden user data export confirmation and file handling"
          git push origin HEAD:agent/harden-user-data-export
