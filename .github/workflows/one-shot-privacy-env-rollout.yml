name: One-shot privacy env rollout integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/automate-privacy-export-env-rollout'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/automate-privacy-export-env-rollout
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements-coverage.txt

      - name: Apply exact patch and focused tests
        run: python tools/agent_patch_privacy_env_rollout.py

      - name: Commit rollout integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/migrate_privacy_export_env.py scripts/prepare_privacy_export_rollout.sh scripts/immutable_deploy.sh deploy/RUNTIME_CONTRACT.md docs/IMMUTABLE_RELEASE_DEPLOYMENT.md tests/test_privacy_export_env_rollout.py
          git diff --cached --check
          git commit -m "Automate privacy export environment rollout"
          git push origin HEAD:agent/automate-privacy-export-env-rollout
