name: Patch ClientPlatform Admin Funnel

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-clientplatform-admin-funnel.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply function-scoped funnel payment patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('handlers/clientplatform_admin_extension.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('async def _enhanced_admin_report(')
          end = source.index('\n\nasync def ', start + 20)
          section = source[start:end]

          unpack_old = '        insights,\n        interaction,\n'
          unpack_new = '        insights,\n        payments,\n        interaction,\n'
          gather_old = (
              '        asyncio.to_thread(admin_ops.business_admin_insights, actor=ctx.actor),\n'
              '        asyncio.to_thread(\n'
              '            admin_ops.interaction_snapshot,\n'
          )
          gather_new = (
              '        asyncio.to_thread(admin_ops.business_admin_insights, actor=ctx.actor),\n'
              '        _optional_thread(\n'
              '            admin_ops.list_payments,\n'
              '            default=[],\n'
              '            actor=ctx.actor,\n'
              '            limit=20,\n'
              '        ),\n'
              '        asyncio.to_thread(\n'
              '            admin_ops.interaction_snapshot,\n'
          )

          if section.count(unpack_old) != 1:
              raise SystemExit(f'unexpected_unpack_count:{section.count(unpack_old)}')
          if section.count(gather_old) != 1:
              raise SystemExit(f'unexpected_gather_count:{section.count(gather_old)}')

          section = section.replace(unpack_old, unpack_new, 1)
          section = section.replace(gather_old, gather_new, 1)
          patched = source[:start] + section + source[end:]
          path.write_text(patched, encoding='utf-8')
          PY
          python -m py_compile handlers/clientplatform_admin_extension.py
          python -m ruff check handlers/clientplatform_admin_extension.py
          rm -f .github/workflows/patch-clientplatform-admin-funnel.yml

      - name: Commit exact patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Load payment records in admin funnel report'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
