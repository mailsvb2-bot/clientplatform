name: ClientPlatform Production Bot Runtime Diagnostic

on:
  workflow_dispatch:
    inputs:
      business_name:
        description: Exact organization name to probe
        required: true
        default: Сантехник
        type: string

permissions:
  contents: read

concurrency:
  group: clientplatform-production-bot-runtime-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_KNOWN_HOSTS }}
      SSH_PORT_SECRET: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_PORT }}
      BUSINESS_NAME: ${{ inputs.business_name }}

    steps:
      - name: Require dedicated ClientPlatform SSH credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?CLIENTPLATFORM_PRODUCTION_SSH_HOST is required}"
          : "${SSH_USER:?CLIENTPLATFORM_PRODUCTION_SSH_USER is required}"
          : "${SSH_PRIVATE_KEY:?CLIENTPLATFORM_PRODUCTION_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?CLIENTPLATFORM_PRODUCTION_SSH_KNOWN_HOSTS is required}"
          SSH_PORT="${SSH_PORT_SECRET:-22}"
          case "$SSH_PORT" in ''|*[!0-9]*) exit 2 ;; esac
          if [ "$SSH_PORT" -lt 1 ] || [ "$SSH_PORT" -gt 65535 ]; then exit 2; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Configure pinned production SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/clientplatform-production-ssh-key"
          known_hosts="$RUNNER_TEMP/clientplatform-production-known-hosts"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Probe live ClientPlatform app runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/clientplatform-production-ssh-key"
          known_hosts="$RUNNER_TEMP/clientplatform-production-known-hosts"
          encoded_name="$(printf '%s' "$BUSINESS_NAME" | base64 -w0)"
          ssh \
            -p "$SSH_PORT" \
            -i "$key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$encoded_name'" <<'REMOTE'
          set -Eeuo pipefail
          encoded_name="$1"
          business_name="$(printf '%s' "$encoded_name" | base64 -d)"
          repo=/opt/clientplatform
          cd "$repo"
          privileged() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }
          app_id="$(privileged docker ps --filter name=clientplatform-production-app-1 --format '{{.ID}}' | head -n1)"
          if [ -z "$app_id" ]; then
            echo "CLIENTPLATFORM_BOT_RUNTIME_DIAGNOSTIC_FAILED:app_container_missing"
            exit 20
          fi
          echo "CLIENTPLATFORM_BOT_RUNTIME_CONTAINER_OK head_sha=$(git rev-parse HEAD)"
          privileged docker exec -e CLIENTPLATFORM_PROBE_BUSINESS_NAME="$business_name" "$app_id" python - <<'PY'
          from __future__ import annotations

          import inspect
          import os
          from handlers import clientplatform_events as events
          from handlers import clientplatform_simple_experience as simple
          from clientplatform.application.cockpit_events import resolve_events_snapshot
          from clientplatform.domain.tenancy import PlatformRole, TenantContext
          from services.db import get_db_ro

          handler_source = inspect.getsource(events.open_event_hub)
          simple_source = inspect.getsource(simple._simple_keyboard)
          print(
              "CLIENTPLATFORM_BOT_RUNTIME_SOURCE "
              f"event_handler={int('send_cockpit_section' in handler_source)} "
              f"webinar_callback={int('cpev:home:' in simple_source)} "
              f"all_menu_callback={int('cpo:more:' in simple_source)}"
          )

          target = os.environ["CLIENTPLATFORM_PROBE_BUSINESS_NAME"]
          with get_db_ro() as conn:
              rows = conn.execute(
                  """
                  SELECT bm.id,bm.business_id,bm.user_id,bm.role,b.name
                  FROM business_members bm
                  JOIN businesses b ON b.id=bm.business_id
                  WHERE bm.status='active'
                    AND b.status='active'
                    AND b.name=?
                  ORDER BY CASE WHEN bm.role='owner' THEN 0 ELSE 1 END, bm.id
                  """,
                  (target,),
              ).fetchall()

          if not rows:
              print("CLIENTPLATFORM_BOT_RUNTIME_DIAGNOSTIC_FAILED:business_not_found")
              raise SystemExit(21)

          print(f"CLIENTPLATFORM_BOT_RUNTIME_MEMBERSHIPS count={len(rows)}")
          failures = 0
          successes = 0
          for row in rows:
              actor = TenantContext(
                  business_id=str(row["business_id"]),
                  membership_id=str(row["id"]),
                  user_id=int(row["user_id"]),
                  role=PlatformRole(str(row["role"])),
              )
              try:
                  snapshot = resolve_events_snapshot(
                      actor=actor,
                      business_name=target,
                      limit=5,
                  )
              except Exception as exc:
                  failures += 1
                  message = " ".join(str(exc).split())[:240]
                  print(
                      "CLIENTPLATFORM_BOT_RUNTIME_EVENT_PROBE_FAIL "
                      f"role={row['role']} exception={type(exc).__name__} message={message}"
                  )
              else:
                  successes += 1
                  print(
                      "CLIENTPLATFORM_BOT_RUNTIME_EVENT_PROBE_OK "
                      f"role={row['role']} events={len(snapshot.items)} "
                      f"can_manage={int(bool(snapshot.can_manage))}"
                  )

          print(
              "CLIENTPLATFORM_BOT_RUNTIME_EVENT_SUMMARY "
              f"successes={successes} failures={failures}"
          )
          if successes == 0:
              raise SystemExit(22)
          PY
          REMOTE
