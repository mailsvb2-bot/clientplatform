name: Single main topology cleanup

# Exact topology audits are requested explicitly through commit-message markers.
# The same marker is used after a reviewed merge to restore the canonical 1/main topology.
# Post-merge marker commits are code-neutral and only trigger the repository topology audit.
# Server audit retries are sent only after the preceding main regression contour is green.
# Final state-integrity deploy recovery, topology verification, and VK production audit after #130.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write
  pull-requests: read

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-branches]')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Delete non-main branches and verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let failure = null;
            let description = 'GitHub branch cleanup did not complete';

            try {
              const branches = await github.paginate(
                github.rest.repos.listBranches,
                { owner, repo, per_page: 100 },
              );

              const preserved = [];

              // One-time, reviewed stale-ref allowlist from docs/BRANCH_CLEANUP_2026-10-04.md.
              // Both branch name and immutable audited SHA must match. Any moved ref is preserved.
              const auditedStaleRefs = new Map([
                ['diag/live-yandex-http400', 'b8aa1bc7bb470073d74673e0fde60de25ee40032'],
                ['feature/visual-provider-prompt-adapters', 'f971fde0ee3ad45f6ab4e4cf21d091099800d7b9'],
                ['feature/visual-semantic-auto-retry', '544392ab37fe81edb829f9bcabd57e70aac87bc2'],
                ['feature/visual-semantic-quality-gate', '64d896336e689c5753cc52c093e28c77dd769dd7'],
                ['feature/visual-style-intent-v1', '297a8e38aa26a8ba5f31792677dd4bd9bd048b1e'],
                ['fix/canonical-owner-navigation-runtime', 'e0b3b446e88e8af5eada2db4eca70feba3c1a624'],
                ['fix/operator-alert-chat-isolation', '80f4a2f6c64eb5e6d64226f224786fcdb048b8cc'],
                ['fix/production-disk-worktree-audit-20261004', '285ea2b8af0999cdc7c252e57e5c146fc7211a34'],
                ['fix/single-owner-menu-root', 'c424505211fec441c931c582a8b80a8a83ec8a12'],
                ['fix/visual-callback-safety-boundary', 'ba438820217bd41ed6e2bbd39c648a77826e66fa'],
                ['fix/visual-provider-production-diagnostic', '89d4ad2c711aec8430158f46ea3b38054fcde110'],
                ['fix/yandex-visual-permission-diagnostic', 'ce2806604ef188849577fb37293e5562c8443ca4'],
                ['ops/deploy-40a5af2-production', '7ffbf9e607751a6da9255d78bb7c79433c020d88'],
                ['ops/deploy-visual-delivery-hotfix', '93701326ebebe13cc6510282b38522daca57e2a9'],
                ['ops/production-visual-live-smoke', '3ab6215df1a5d3ed4e25a24907545b7ead679eef'],
                ['recover-production-deploy/image-framing-visual-diagnostic', '66b142cdc75a68660f568713b26dc31d5e86585d'],
                ['revert/production-disk-audit-567', 'a0cd1e01f303f042260eea3b70f7896736b8b6d5'],
              ]);

              for (const branch of branches) {
                if (branch.name === 'main') continue;

                const head = `${owner}:${branch.name}`;
                const openPulls = await github.paginate(
                  github.rest.pulls.list,
                  { owner, repo, state: 'open', head, per_page: 100 },
                );
                if (openPulls.length > 0) {
                  preserved.push(`${branch.name}:open-pr`);
                  core.warning(
                    `Preserving non-main branch with open PR: ${branch.name}`,
                  );
                  continue;
                }

                const closedPulls = await github.paginate(
                  github.rest.pulls.list,
                  {
                    owner,
                    repo,
                    state: 'closed',
                    head,
                    base: 'main',
                    per_page: 100,
                  },
                );
                const exactMergedPull = closedPulls.find(
                  (pull) =>
                    Boolean(pull.merged_at) &&
                    pull.head &&
                    pull.head.sha === branch.commit.sha,
                );
                const auditedStaleSha = auditedStaleRefs.get(branch.name);
                const exactAuditedStale =
                  Boolean(auditedStaleSha) && auditedStaleSha === branch.commit.sha;
                if (!exactMergedPull && !exactAuditedStale) {
                  preserved.push(`${branch.name}:not-proven-merged-or-audited-stale`);
                  core.warning(
                    `Preserving non-main branch without exact merged or audited-stale proof: ${branch.name}`,
                  );
                  continue;
                }

                const currentRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
                if (currentRef.data.object.sha !== branch.commit.sha) {
                  preserved.push(`${branch.name}:head-moved`);
                  core.warning(
                    `Preserving non-main branch whose head moved during cleanup: ${branch.name}`,
                  );
                  continue;
                }

                const openPullsBeforeDelete = await github.paginate(
                  github.rest.pulls.list,
                  { owner, repo, state: 'open', head, per_page: 100 },
                );
                if (openPullsBeforeDelete.length > 0) {
                  preserved.push(`${branch.name}:open-pr-race`);
                  core.warning(
                    `Preserving non-main branch because an open PR appeared during cleanup: ${branch.name}`,
                  );
                  continue;
                }

                if (exactMergedPull) {
                  core.info(
                    `Deleting proven-merged non-main branch: ${branch.name} via PR #${exactMergedPull.number}`,
                  );
                } else {
                  core.info(
                    `Deleting exact-SHA audited stale branch: ${branch.name} at ${branch.commit.sha}`,
                  );
                }
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
              }

              let names = [];
              for (let attempt = 1; attempt <= 10; attempt += 1) {
                const remaining = await github.paginate(
                  github.rest.repos.listBranches,
                  { owner, repo, per_page: 100 },
                );
                names = remaining.map((branch) => branch.name).sort();
                core.info(
                  `GITHUB_BRANCH_VERIFY_ATTEMPT=${attempt} count=${names.length} branches=${names.join(',')}`,
                );
                if (names.length === 1 && names[0] === 'main') {
                  break;
                }
                await new Promise((resolve) => setTimeout(resolve, attempt * 500));
              }

              core.info(`GITHUB_BRANCH_COUNT=${names.length}`);
              core.info(`GITHUB_BRANCHES=${names.join(',')}`);

              if (preserved.length > 0) {
                throw new Error(
                  `Refusing to delete non-main branches without exact merged or audited-stale proof: ${preserved.join(',')}`,
                );
              }
              if (names.length !== 1 || names[0] !== 'main') {
                throw new Error(
                  `Expected exactly one GitHub branch named main; got ${names.length}: ${names.join(',')}`,
                );
              }
              description = `GitHub branches=${names.length}: ${names.join(',')}`;
            } catch (error) {
              failure = error;
              description = `Branch cleanup failed: ${error.message}`.slice(0, 140);
            }

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.sha,
              state: failure ? 'failure' : 'success',
              context: 'ops/single-main-topology',
              description,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

            if (failure) {
              core.setFailed(failure.message);
            }
