name: ClientPlatform Capability Parity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  capability-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate versioned capability parity manifest
        run: python scripts/check_clientplatform_capability_parity_manifest.py

      - name: Run capability parity regressions
        run: |
          python -m unittest -v \
            tests/test_clientplatform_capability_parity_manifest.py \
            tests/test_clientplatform_capability_parity.py
