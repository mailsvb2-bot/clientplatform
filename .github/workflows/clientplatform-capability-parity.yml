name: ClientPlatform Capability Parity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  capability-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate versioned capability parity manifest
        run: python scripts/check_clientplatform_capability_parity_manifest.py

      - name: Run capability parity regressions
        run: |
          python -m unittest -v \
            tests/test_clientplatform_capability_parity_manifest.py \
            tests/test_clientplatform_capability_parity.py
