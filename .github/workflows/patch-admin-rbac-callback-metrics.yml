name: Patch Admin RBAC And Callback Metrics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-admin-rbac-callback-metrics.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def section(source: str, marker: str) -> tuple[int, int, str]:
              start = source.index(marker)
              end = source.find('\n\ndef ', start + len(marker))
              if end < 0:
                  end = len(source)
              return start, end, source[start:end]

          ops_path = Path('clientplatform/application/admin_ops.py')
          ops = ops_path.read_text(encoding='utf-8')
          start = ops.index('_FINANCE_ROLES = frozenset(')
          end = ops.index('_OBSERVABILITY_ROLES', start)
          old_block = ops[start:end]
          if 'PlatformRole.ANALYST' not in old_block:
              raise SystemExit('finance_role_block_changed')
          read_block = old_block.replace('_FINANCE_ROLES', '_FINANCE_READ_ROLES', 1)
          write_block = read_block.replace('_FINANCE_READ_ROLES', '_FINANCE_WRITE_ROLES', 1)
          write_block = write_block.replace('        PlatformRole.ANALYST,\n', '', 1)
          ops = ops[:start] + read_block + write_block + ops[end:]
          for name, role_set in (
              ('record_payment', '_FINANCE_WRITE_ROLES'),
              ('set_offering_price', '_FINANCE_WRITE_ROLES'),
              ('list_payments', '_FINANCE_READ_ROLES'),
              ('list_offering_prices', '_FINANCE_READ_ROLES'),
          ):
              s, e, body = section(ops, f'def {name}(')
              if body.count('allowed_roles=_FINANCE_ROLES') != 1:
                  raise SystemExit(f'finance_use_changed:{name}')
              body = body.replace('allowed_roles=_FINANCE_ROLES', f'allowed_roles={role_set}', 1)
              ops = ops[:s] + body + ops[e:]
          if '_FINANCE_ROLES' in ops:
              raise SystemExit('legacy_finance_roles_remain')
          ops_path.write_text(ops, encoding='utf-8')

          path = Path('handlers/clientplatform_admin_extension.py')
          source = path.read_text(encoding='utf-8')
          old_import = 'from clientplatform.domain.tenancy import TenancyError\n'
          if source.count(old_import) != 1:
              raise SystemExit('tenancy_import_changed')
          source = source.replace(
              old_import,
              'from clientplatform.domain.tenancy import TenantPermissionDenied, TenancyError\n',
              1,
          )

          gate_start, gate_end, gate = section(source, 'async def admin_ops_gate(')
          branch_start = gate.index('    if action == "autopilot-toggle":')
          branch_end = gate.index('    if action == "alerts-refresh":', branch_start)
          branch = gate[branch_start:branch_end]
          toggle_line = '        await asyncio.to_thread(admin_ops.toggle_autopilot, actor=ctx.actor)\n'
          if branch.count(toggle_line) != 1:
              raise SystemExit('autopilot_toggle_changed')
          guard = (
              '        if ctx.role not in admin._AUTOMATION_ROLES:\n'
              '            raise TenantPermissionDenied(\n'
              '                "automation controls are not allowed for this business role"\n'
              '            )\n'
          )
          branch = branch.replace(toggle_line, guard + toggle_line, 1)
          gate = gate[:branch_start] + branch + gate[branch_end:]
          source = source[:gate_start] + gate + source[gate_end:]

          trace_start = source.index('    async def traced_call(')
          trace_end = source.index('\n    safety._answer_callback', trace_start)
          trace = source[trace_start:trace_end]
          trace = trace.replace(
              '        success = False\n        error_code: str | None = None\n',
              '        success = False\n        handler_invoked = False\n        error_code: str | None = None\n',
              1,
          )
          trace = trace.replace(
              '        ) -> Any:\n            now = time.perf_counter()\n',
              '        ) -> Any:\n            nonlocal handler_invoked\n            handler_invoked = True\n            now = time.perf_counter()\n',
              1,
          )
          trace = trace.replace(
              '            success = True\n            return result\n',
              '            success = handler_invoked\n            if not handler_invoked:\n                error_code = "suppressed_callback"\n            return result\n',
              1,
          )
          required = (
              'handler_invoked = False',
              'nonlocal handler_invoked',
              'success = handler_invoked',
              'error_code = "suppressed_callback"',
          )
          if not all(item in trace for item in required) or 'success = True' in trace:
              raise SystemExit('trace_patch_incomplete')
          source = source[:trace_start] + trace + source[trace_end:]
          path.write_text(source, encoding='utf-8')
          PY
          cat > tests/test_handlers_clientplatform_post_merge_review_hardening.py <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          OPS = ROOT / 'clientplatform/application/admin_ops.py'
          HANDLER = ROOT / 'handlers/clientplatform_admin_extension.py'

          def source(path: Path) -> str:
              value = path.read_text(encoding='utf-8')
              ast.parse(value)
              return value

          def function(value: str, name: str) -> str:
              start = value.index(f'def {name}(')
              end = value.find('\n\ndef ', start + 10)
              return value[start:] if end < 0 else value[start:end]

          def test_finance_rbac_is_read_write_separated() -> None:
              value = source(OPS)
              read = value[value.index('_FINANCE_READ_ROLES'):value.index('_FINANCE_WRITE_ROLES')]
              write = value[value.index('_FINANCE_WRITE_ROLES'):value.index('_OBSERVABILITY_ROLES')]
              assert 'PlatformRole.ANALYST' in read
              assert 'PlatformRole.ANALYST' not in write
              for name in ('record_payment', 'set_offering_price'):
                  assert 'allowed_roles=_FINANCE_WRITE_ROLES' in function(value, name)
              for name in ('list_payments', 'list_offering_prices'):
                  assert 'allowed_roles=_FINANCE_READ_ROLES' in function(value, name)

          def test_autopilot_direct_callback_rechecks_role() -> None:
              value = function(source(HANDLER), 'admin_ops_gate')
              branch = value[value.index('if action == "autopilot-toggle"'):value.index('if action == "alerts-refresh"')]
              assert 'ctx.role not in admin._AUTOMATION_ROLES' in branch
              assert branch.index('_AUTOMATION_ROLES') < branch.index('toggle_autopilot')

          def test_suppressed_callback_is_not_success() -> None:
              value = source(HANDLER)
              traced = value[value.index('    async def traced_call('):value.index('\n    safety._answer_callback', value.index('    async def traced_call('))]
              assert 'handler_invoked = False' in traced
              assert 'nonlocal handler_invoked' in traced
              assert 'success = handler_invoked' in traced
              assert 'error_code = "suppressed_callback"' in traced
              assert 'success = True' not in traced
          PY
          python -m py_compile clientplatform/application/admin_ops.py handlers/clientplatform_admin_extension.py tests/test_handlers_clientplatform_post_merge_review_hardening.py
          rm -f .github/workflows/patch-admin-rbac-callback-metrics.yml
      - name: Commit hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Harden admin RBAC and callback metrics'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
