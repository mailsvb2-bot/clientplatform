name: ClientPlatform Production Isolation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientplatform-production-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-isolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientplatform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clientplatform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: prod
      LOAD_DOTENV: "0"
      CLIENTPLATFORM_DB_ENGINE: postgres
      CLIENTPLATFORM_DATABASE_NAME: clientplatform_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clientplatform_ci
      POSTGRES_REUSE_CONNECTIONS: "0"
      BOT_TOKEN: ci-bot-token-material
      ADMIN_IDS: "100001"
      PAYMENT_CHECKOUT_SIGNING_KEY: ci-payment-signing-key-material-000000000000
      PAYMENT_PUBLIC_BASE_URL: https://clientplatform.production.internal
      YOOKASSA_SECRET_KEY: ci-yookassa-secret-material
      YOOKASSA_SHOP_ID: "100001"
      TELEGRAM_TRANSPORT: polling
      TELEGRAM_WEBHOOK_ENABLED: "0"
      CLIENTPLATFORM_BOT_GATEWAY_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install hash-locked dependencies and PostgreSQL 16 client
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          # GitHub's Ubuntu image can route mirror+file through an Azure mirror that
          # occasionally stalls for the lifetime of this fail-closed job. Pin that
          # runner indirection to Ubuntu's canonical HTTPS archive and bound every
          # network attempt so infrastructure loss fails quickly instead of hiding
          # the production-isolation verdict behind a 35-minute timeout.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install --yes --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Production isolation contract tests
        run: |
          set -o pipefail
          python -m unittest -v \
            tests/test_clientplatform_production_isolation.py \
            tests/test_clientplatform_s3_replication.py \
            tests/test_clientplatform_s3_replication_hardening.py \
            tests/test_clientplatform_bot_gateway_preflight.py \
            tests/test_clientplatform_bot_provisioning.py \
            tests/test_runtime_clientplatform_bot_provisioning.py \
            tests/test_application_clientplatform_bot_provisioning.py \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-production-isolation-tests.log"

      - name: Build isolated production environment fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("deploy/clientplatform/clientplatform.production.env.example")
          values = {}
          for raw in source.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              name, separator, value = line.partition("=")
              if not separator:
                  raise SystemExit(f"invalid env line: {line}")
              values[name] = value
          domain = "clientplatform.production.internal"
          values.update(
              {
                  "APP_ENV": "prod",
                  "CLIENTPLATFORM_DOMAIN": domain,
                  "CLIENTPLATFORM_PUBLIC_BASE_URL": f"https://{domain}",
                  "BOT_TOKEN": "ci-bot-token-material-without-provider-shape",
                  "ADMIN_IDS": "100001",
                  "CLIENTPLATFORM_DATABASE_NAME": "clientplatform_ci",
                  "DATABASE_URL": "postgresql://clientplatform_app:ci-app-password@127.0.0.1:5432/clientplatform_ci",
                  "TELEGRAM_TRANSPORT": "polling",
                  "RUN_MODE": "polling",
                  "TELEGRAM_WEBHOOK_ENABLED": "0",
                  "TELEGRAM_LEGACY_TOKEN_WEBHOOK_ENABLED": "0",
                  "TELEGRAM_WEBHOOK_PUBLIC_BASE_URL": "",
                  "TELEGRAM_WEBHOOK_SECRET_TOKEN": "",
                  "TELEGRAM_WEBHOOK_PREFIX": "",
                  "MESSENGER_PUBLIC_BASE_URL": f"https://{domain}",
                  "PAYMENT_PUBLIC_BASE_URL": f"https://{domain}",
                  "PRIVACY_EXPORT_PUBLIC_BASE_URL": f"https://{domain}",
                  "HEALTHCHECK_DIAGNOSTICS_TOKEN": "d" * 48,
                  "CLIENTPLATFORM_MEDIA_GATEWAY_BASE_URL": f"https://{domain}/clientplatform",
                  "CLIENTPLATFORM_MEDIA_GATEWAY_S3_ENDPOINT": "https://s3.production.internal",
                  "CLIENTPLATFORM_MEDIA_GATEWAY_S3_REGION": "region-1",
                  "CLIENTPLATFORM_SECRET_S3_ACCESS_KEY": "access-key-material",
                  "CLIENTPLATFORM_SECRET_S3_SECRET_KEY": "secret-key-material",
                  "CLIENTPLATFORM_SECRET_MEDIA_SIGNING_KEY": "m" * 48,
                  "CLIENTPLATFORM_S3_BACKUP_REPLICATION_ENABLED": "1",
              }
          )
          target = Path("/tmp/clientplatform-production.env")
          target.write_text(
              "".join(f"{name}={value}\n" for name, value in sorted(values.items())),
              encoding="utf-8",
          )
          PY

      - name: Validate systemd production preflights
        run: |
          set -o pipefail
          python scripts/clientplatform_production_preflight.py \
            --env-file /tmp/clientplatform-production.env \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-production-preflight.log"
          python scripts/clientplatform_bot_gateway_preflight.py \
            --env-file /tmp/clientplatform-production.env \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-bot-gateway-preflight.log"

      - name: Validate Docker build and Compose topology
        env:
          CLIENTPLATFORM_POSTGRES_ADMIN_PASSWORD: ci-admin-password
          CLIENTPLATFORM_POSTGRES_APP_PASSWORD: ci-app-password
          CLIENTPLATFORM_DOMAIN: clientplatform.production.internal
        run: |
          cp deploy/clientplatform/clientplatform.production.env.example \
            deploy/clientplatform/clientplatform.env
          docker compose -f deploy/clientplatform/compose.production.yml config \
            > "$RUNNER_TEMP/clientplatform-compose-config.yml"
          docker build --file deploy/clientplatform/Dockerfile \
            --tag clientplatform-production:ci .
          rm -f deploy/clientplatform/clientplatform.env

      - name: Provision least-privilege application role
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname clientplatform_ci \
            --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE clientplatform_app
            LOGIN PASSWORD 'ci-app-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          GRANT CONNECT ON DATABASE clientplatform_ci TO clientplatform_app;
          GRANT USAGE, CREATE ON SCHEMA public TO clientplatform_app;
          SQL
          test "$(psql --host 127.0.0.1 --username postgres --dbname clientplatform_ci \
            --tuples-only --no-align --command \
            "SELECT (NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole)::text FROM pg_roles WHERE rolname='clientplatform_app'")" = "true"

      - name: Initialize live PostgreSQL schema as application role
        env:
          DATABASE_URL: postgresql://clientplatform_app:ci-app-password@127.0.0.1:5432/clientplatform_ci
        run: |
          python - <<'PY'
          from services.schema import init_db
          init_db()
          print("CLIENTPLATFORM_POSTGRES_SCHEMA_OK")
          PY
          PGPASSWORD=ci-app-password psql \
            --host 127.0.0.1 --username clientplatform_app --dbname clientplatform_ci \
            --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --command "SELECT to_regclass('public.managed_bots') IS NOT NULL AND to_regclass('public.bot_gateway_ingress_events') IS NOT NULL AND to_regclass('public.managed_bot_provisioning_requests') IS NOT NULL" \
            | grep -Fx t

      - name: Create backup as application role and prove admin-only restore
        env:
          DATABASE_URL: postgresql://clientplatform_app:ci-app-password@127.0.0.1:5432/clientplatform_ci
          CLIENTPLATFORM_RESTORE_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CLIENTPLATFORM_BACKUP_DIR: /tmp/clientplatform-backups
          CLIENTPLATFORM_RESTORE_EVIDENCE_DIR: /tmp/clientplatform-restore-evidence
        run: |
          set -o pipefail
          BACKUP_MARKER="$(python scripts/clientplatform_postgres_backup.py backup | tail -1)"
          case "$BACKUP_MARKER" in
            CLIENTPLATFORM_BACKUP_OK:*)
              BACKUP_PATH="${BACKUP_MARKER#CLIENTPLATFORM_BACKUP_OK:}"
              ;;
            *)
              echo "Unexpected backup marker: $BACKUP_MARKER" >&2
              exit 1
              ;;
          esac
          test -f "$BACKUP_PATH"
          /usr/lib/postgresql/16/bin/pg_restore --list "$BACKUP_PATH" \
            | grep -E 'TABLE DATA public (managed_bots|bot_gateway_ingress_events|managed_bot_provisioning_requests)' \
            > "$RUNNER_TEMP/clientplatform-backup-gateway-tables.log"
          python scripts/clientplatform_postgres_backup.py restore-drill "$BACKUP_PATH" \
            | tee "$RUNNER_TEMP/clientplatform-restore-drill.log"

      - name: Upload production isolation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clientplatform-production-isolation-evidence
          path: |
            ${{ runner.temp }}/clientplatform-production-isolation-tests.log
            ${{ runner.temp }}/clientplatform-production-preflight.log
            ${{ runner.temp }}/clientplatform-bot-gateway-preflight.log
            ${{ runner.temp }}/clientplatform-compose-config.yml
            ${{ runner.temp }}/clientplatform-backup-gateway-tables.log
            ${{ runner.temp }}/clientplatform-restore-drill.log
          if-no-files-found: warn
