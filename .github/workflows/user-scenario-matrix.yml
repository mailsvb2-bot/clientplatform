name: User Scenario Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-scenario-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-user-scenarios:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    name: all public journeys / py3.12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LOAD_DOTENV: '0'
      TELEGRAM_TRANSPORT: polling
      TELEGRAM_WEBHOOK_ENABLED: '0'
      TELEGRAM_LEGACY_TOKEN_WEBHOOK_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Emulate all critical user scenarios
        run: |
          set -o pipefail
          python scripts/all_user_scenario_gate.py 2>&1 | tee "$RUNNER_TEMP/all-user-scenarios.log"

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: all-user-scenario-log
          path: ${{ runner.temp }}/all-user-scenarios.log
          if-no-files-found: error
