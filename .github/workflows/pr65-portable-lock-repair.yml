name: PR65 portable lock repair

on:
  push:
    branches:
      - agent/harden-admin-rbac-and-callback-metrics
    paths:
      - .github/workflows/pr65-portable-lock-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: agent/harden-admin-rbac-and-callback-metrics

      - name: Constrain NumPy to portable Python 3.12/3.13 line
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("requirements.in")
          value = path.read_text(encoding="utf-8")
          marker = "matplotlib>=3.10,<3.11\n"
          constraint = "numpy>=2.4.3,<2.5\n"
          if constraint not in value:
              if marker not in value:
                  raise SystemExit("matplotlib requirement marker was not found")
              value = value.replace(marker, marker + constraint, 1)
          path.write_text(value, encoding="utf-8")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile and prove Python 3.12 locks
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2 pip-tools==7.5.3
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements.txt \
            requirements.in
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements-dev.txt \
            requirements-dev.in
          python -m pip install --require-hashes -r requirements.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Compile and prove Python 3.13 lock
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2 pip-tools==7.5.3
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements-py313.txt \
            requirements.in
          python -m pip install --require-hashes -r requirements-py313.txt

      - name: Commit portable locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.in requirements.txt requirements-dev.txt requirements-py313.txt
          git diff --cached --check
          git diff --cached --quiet && { echo "No lock changes produced"; exit 0; }
          git commit -m "Make dependency locks portable across Python 3.12 and 3.13"
          git push origin HEAD:agent/harden-admin-rbac-and-callback-metrics
