name: One-shot privacy runtime contract integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/enforce-privacy-export-runtime-contract'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/enforce-privacy-export-runtime-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Apply exact patch and focused tests
        run: python tools/agent_patch_privacy_runtime_contract.py

      - name: Commit runtime contract hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            deploy/RUNTIME_CONTRACT.md \
            scripts/runtime_contract.py \
            scripts/prod_readiness_check.py \
            tests/test_runtime_contract.py \
            tests/test_prod_readiness_messenger_env.py
          git diff --cached --check
          git commit -m "Enforce privacy export production runtime contract"
          git push origin HEAD:agent/enforce-privacy-export-runtime-contract
