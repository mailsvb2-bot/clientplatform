name: clientplatform Boundary Diagnostics

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Tenancy boundary
        run: python -m unittest -v tests.test_clientplatform_tenancy_foundation

      - name: Customer boundary
        run: python -m unittest -v tests.test_clientplatform_customer_boundary

      - name: Program delivery vertical
        run: python -m unittest -v tests.test_clientplatform_program_delivery_vertical

      - name: Connections and dispatch outbox
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_clientplatform_connections_dispatch_outbox \
            tests.test_clientplatform_dispatch_observability \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-connections-dispatch.log"

      - name: Runtime ownership, gateway and staging
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_clientplatform_signed_media_runtime_composition \
            tests.test_clientplatform_media_gateway_contract \
            tests.test_clientplatform_self_contained_staging \
            tests.test_clientplatform_runtime_application_owner \
            tests.test_clientplatform_health_readiness \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-runtime-readiness.log"

      - name: Upload clientplatform boundary diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clientplatform-boundary-diagnostic-log
          path: |
            ${{ runner.temp }}/clientplatform-connections-dispatch.log
            ${{ runner.temp }}/clientplatform-runtime-readiness.log
          if-no-files-found: warn
