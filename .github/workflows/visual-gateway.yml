name: Visual Gateway Contract

on:
  pull_request:
    paths:
      - "visual_gateway/**"
      - "visual_provider_gateway/**"
      - "deploy/clientplatform/compose.production.yml"
      - "deploy.sh"
      - "scripts/clientplatform_visual_provider_rollout.py"
      - "tests/test_visual_provider_gateway_production_contract.py"
      - ".github/workflows/visual-gateway.yml"
  push:
    branches: [main]
    paths:
      - "visual_gateway/**"
      - "visual_provider_gateway/**"
      - "deploy/clientplatform/compose.production.yml"
      - "deploy.sh"
      - "scripts/clientplatform_visual_provider_rollout.py"
      - "tests/test_visual_provider_gateway_production_contract.py"
      - ".github/workflows/visual-gateway.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            visual_gateway/requirements-test.txt
            visual_provider_gateway/requirements-dev.txt
      - name: Install gateway test dependencies
        run: |
          python -m pip install -r visual_gateway/requirements-test.txt
          python -m pip install -r visual_provider_gateway/requirements-dev.txt
      - name: Compile gateway source
        run: |
          python -m py_compile visual_gateway/__init__.py visual_gateway/server.py
          python -m py_compile visual_provider_gateway/*.py
      - name: Run ClientPlatform gateway contract tests
        run: PYTHONPATH=. python -m pytest -q visual_gateway/tests
      - name: Run provider adapter gateway tests
        run: PYTHONPATH=. python -m pytest -q visual_provider_gateway/tests
      - name: Run production topology contract tests
        run: python -m unittest -v tests/test_visual_provider_gateway_production_contract.py
      - name: Build versioned ClientPlatform gateway image
        run: docker build -f visual_gateway/Dockerfile --build-arg VCS_REF="${GITHUB_SHA}" -t clientplatform-visual-gateway:"${GITHUB_SHA}" .
      - name: Build versioned provider gateway image
        run: docker build -f visual_provider_gateway/Dockerfile --build-arg VCS_REF="${GITHUB_SHA}" -t clientplatform-visual-provider-gateway:"${GITHUB_SHA}" .
