name: clientplatform Progress Test Apply

on:
  push:
    branches:
      - agent/customer-program-progress

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/customer-program-progress
          fetch-depth: 1

      - name: Apply progress behavior regression updates
        run: |
          set -Eeuo pipefail
          python scripts/.patch_progress_behavior_tests.py
          rm -f scripts/.patch_progress_behavior_tests.py
          rm -f .github/workflows/clientplatform-progress-test-apply.yml
          python -m compileall -q tests/test_clientplatform_control_bot_behavior.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update progress portal behavior regressions"
          git push origin HEAD:agent/customer-program-progress
