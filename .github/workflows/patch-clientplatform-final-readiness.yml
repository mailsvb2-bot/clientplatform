name: Patch ClientPlatform Final Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-clientplatform-final-readiness.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact tenancy and readiness patches
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          admin_path = Path('handlers/clientplatform_admin_extension.py')
          admin_source = admin_path.read_text(encoding='utf-8')
          import_old = '''from clientplatform.domain.tenancy import (
              TenantPermissionDenied,
              TenancyError,
          )
          '''
          import_new = 'from clientplatform.domain.tenancy import TenancyError\n'
          except_old = '    except TenantPermissionDenied:\n        return default\n'
          except_new = '    except TenancyError:\n        return default\n'
          if admin_source.count(import_old) != 1:
              raise SystemExit(f'unexpected_tenancy_import_count:{admin_source.count(import_old)}')
          if admin_source.count(except_old) != 1:
              raise SystemExit(f'unexpected_optional_except_count:{admin_source.count(except_old)}')
          admin_source = admin_source.replace(import_old, import_new, 1)
          admin_source = admin_source.replace(except_old, except_new, 1)
          admin_path.write_text(admin_source, encoding='utf-8')

          egress_path = Path('core/telegram_multi_egress.py')
          egress_source = egress_path.read_text(encoding='utf-8')
          readiness_old = '''def telegram_readiness_required() -> bool:
              raw = (
                  os.getenv("CLIENTPLATFORM_REQUIRE_TELEGRAM_POLLING_READY")
                  or "true"
              ).strip().lower()
              return raw in {"1", "true", "yes", "on"}
          '''
          readiness_new = '''def telegram_readiness_required() -> bool:
              raw = (
                  os.getenv("CLIENTPLATFORM_REQUIRE_TELEGRAM_POLLING_READY")
                  or "false"
              ).strip().lower()
              return raw in {"1", "true", "yes", "on"}
          '''
          if egress_source.count(readiness_old) != 1:
              raise SystemExit(f'unexpected_readiness_target_count:{egress_source.count(readiness_old)}')
          egress_path.write_text(
              egress_source.replace(readiness_old, readiness_new, 1),
              encoding='utf-8',
          )
          PY
          python -m py_compile \
            handlers/clientplatform_admin_extension.py \
            core/telegram_multi_egress.py \
            clientplatform/runtime/admin_observability.py
          rm -f .github/workflows/patch-clientplatform-final-readiness.yml

      - name: Commit exact patches
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Make optional tenancy reads fail-soft and readiness opt-in'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
