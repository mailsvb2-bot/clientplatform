name: One-shot storefront label correction

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/paginate-booking-surfaces'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/paginate-booking-surfaces
      - name: Preserve public storefront copy contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('handlers/clientplatform_owner_journey.py')
          text = path.read_text(encoding='utf-8')
          old = '        title=business_name,\n        empty_text=(\n'
          new = '        title=f"{business_name}\\n\\nДоступно для записи",\n        empty_text=(\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one storefront title contract, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall handlers/clientplatform_owner_journey.py
          git diff --check
          rm .github/workflows/one-shot-storefront-label-fix.yml
          git config user.name "clientplatform-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve public storefront booking label"
          git push origin HEAD:agent/paginate-booking-surfaces
