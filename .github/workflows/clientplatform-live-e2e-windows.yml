name: ClientPlatform Live E2E Windows

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: clientplatform-live-e2e-windows
  cancel-in-progress: false

jobs:
  live-user-journeys:
    if: ${{ vars.CLIENTPLATFORM_LIVE_E2E_ENABLED == '1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_id: windows-10
            os_label: clientplatform-windows-10
          - os_id: windows-11
            os_label: clientplatform-windows-11
    runs-on: [self-hosted, Windows, X64, clientplatform-live-e2e, "${{ matrix.os_label }}"]
    environment: clientplatform_live_e2e
    timeout-minutes: 90
    env:
      APP_ENV: staging
      LOAD_DOTENV: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      CLIENTPLATFORM_LIVE_E2E: '1'
      CLIENTPLATFORM_LIVE_E2E_TEST_ACCOUNTS: '1'
      CLIENTPLATFORM_LIVE_E2E_PRODUCTION_CREDENTIALS: '0'
      CLIENTPLATFORM_LIVE_E2E_REAL_MONEY: '0'
      CLIENTPLATFORM_E2E_EXPECTED_WINDOWS: ${{ matrix.os_id }}
      CLIENTPLATFORM_E2E_RUNNER_IDENTITY: .clientplatform-live-e2e-runner-identity.json
      CLIENTPLATFORM_E2E_TELEGRAM_EXE: ${{ vars.CLIENTPLATFORM_E2E_TELEGRAM_EXE }}
      CLIENTPLATFORM_E2E_TELEGRAM_PROCESS: ${{ vars.CLIENTPLATFORM_E2E_TELEGRAM_PROCESS }}
      CLIENTPLATFORM_E2E_TELEGRAM_CHAT: ${{ vars.CLIENTPLATFORM_E2E_TELEGRAM_CHAT }}
      CLIENTPLATFORM_E2E_MAX_EXE: ${{ vars.CLIENTPLATFORM_E2E_MAX_EXE }}
      CLIENTPLATFORM_E2E_MAX_PROCESS: ${{ vars.CLIENTPLATFORM_E2E_MAX_PROCESS }}
      CLIENTPLATFORM_E2E_MAX_CHAT: ${{ vars.CLIENTPLATFORM_E2E_MAX_CHAT }}
      CLIENTPLATFORM_E2E_VK_BROWSER: ${{ vars.CLIENTPLATFORM_E2E_VK_BROWSER }}
      CLIENTPLATFORM_E2E_VK_CHAT_URL: ${{ vars.CLIENTPLATFORM_E2E_VK_CHAT_URL }}
      CLIENTPLATFORM_E2E_COCKPIT_URL: ${{ vars.CLIENTPLATFORM_E2E_COCKPIT_URL }}
      CLIENTPLATFORM_E2E_EDGE_EXE: ${{ vars.CLIENTPLATFORM_E2E_EDGE_EXE }}
      CLIENTPLATFORM_E2E_CHROME_EXE: ${{ vars.CLIENTPLATFORM_E2E_CHROME_EXE }}

    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          clean: true

      - name: Reject non-main source
        shell: powershell
        run: |
          if ("$env:GITHUB_REF" -ne "refs/heads/main" -and "$env:GITHUB_EVENT_NAME" -ne "schedule") {
            throw "Live E2E may execute only from trusted main."
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install hash-locked test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Validate Windows 10/11 x64 interactive runner
        shell: powershell
        run: ./scripts/live_e2e/windows/validate_runner.ps1

      - name: Validate manifest and safety contract
        run: python scripts/check_live_e2e_manifest.py

      - name: Run hermetic user-scenario wall first
        run: python scripts/all_user_scenario_gate.py

      - name: Verify interactive Windows staging session
        run: python scripts/clientplatform_live_e2e.py --preflight

      - name: Run real desktop and browser journeys
        run: python scripts/clientplatform_live_e2e.py --execute --evidence-dir "${{ runner.temp }}\clientplatform-live-e2e\${{ matrix.os_id }}"

      - name: Upload synthetic live E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clientplatform-live-e2e-${{ matrix.os_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}\clientplatform-live-e2e\${{ matrix.os_id }}
          if-no-files-found: warn
          retention-days: 7
