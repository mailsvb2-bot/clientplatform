name: Materialize UI candidate

on:
  push:
    branches:
      - fix/unified-personalized-messenger-home

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/candidate-payload/part-* | base64 -d | gzip -d > /tmp/candidate.patch
          git apply --index /tmp/candidate.patch
          rm -rf .github/candidate-payload .github/workflows/materialize-ui-candidate.yml
          git add -A
          actual_tree="$(git write-tree)"
          expected_tree="3ad4aa702790e176b880799dac538dd4df199f44"
          test "$actual_tree" = "$expected_tree"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: unify personalized messenger home"
          git push origin "HEAD:${GITHUB_REF_NAME}"
