name: ClientPlatform UCR Gateway Sidecar

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ucr-gateway-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run sidecar contract regressions
        run: python -m unittest -v tests/test_ucr_gateway_sidecar.py

      - name: Build pinned UCR sidecar image
        run: docker build -f ucr_gateway_sidecar/Dockerfile -t clientplatform-ucr-gateway-sidecar .

      - name: Verify generated pinned UCR bindings
        run: |
          docker run --rm --entrypoint python clientplatform-ucr-gateway-sidecar -c \
            "from ucr.v1 import call_pb2, call_pb2_grpc, integration_pb2, integration_pb2_grpc; from ucr_gateway_sidecar.server import UCR_PINNED_REVISION; assert UCR_PINNED_REVISION == '8097b41e69634c944c225f7071e80b991d4ddc02'"
