name: ClientPlatform UCR Gateway Sidecar

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ucr-gateway-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run sidecar contract regressions
        run: python -m unittest -v tests/test_ucr_gateway_sidecar.py

      - name: Build pinned UCR sidecar image
        run: docker build -f ucr_gateway_sidecar/Dockerfile -t clientplatform-ucr-gateway-sidecar .

      - name: Verify generated pinned UCR bindings
        run: |
          docker run --rm --entrypoint python clientplatform-ucr-gateway-sidecar -c \
            "from ucr.v1 import call_pb2, call_pb2_grpc, integration_pb2, integration_pb2_grpc, universal_conference_pb2, universal_conference_pb2_grpc; from ucr_gateway_sidecar.server import UCR_PINNED_REVISION; assert UCR_PINNED_REVISION == '22d598e057769d59fe0aa47e169cf2eb904abb18'; assert hasattr(universal_conference_pb2, 'UniversalGetParticipantAttendanceRequest'); assert hasattr(universal_conference_pb2_grpc, 'UniversalConferenceServiceStub')"
