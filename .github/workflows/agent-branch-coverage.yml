name: One-shot branch coverage integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    if: github.head_ref == 'agent/add-explicit-branch-coverage-gate'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/add-explicit-branch-coverage-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements-coverage.txt

      - name: Apply CI patch and focused tests
        run: python tools/agent_patch_branch_coverage_ci.py

      - name: Upload validated CI workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-branch-coverage-ci
          path: .github/workflows/ci.yml
          if-no-files-found: error
