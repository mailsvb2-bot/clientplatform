name: Production MAX entry repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientplatform-production-max-entry-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_KNOWN_HOSTS }}
      SSH_PORT_SECRET: ${{ secrets.CLIENTPLATFORM_PRODUCTION_SSH_PORT }}

    steps:
      - name: Require dedicated ClientPlatform SSH credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_HOST:?CLIENTPLATFORM_PRODUCTION_SSH_HOST is required}"
          : "${SSH_USER:?CLIENTPLATFORM_PRODUCTION_SSH_USER is required}"
          : "${SSH_PRIVATE_KEY:?CLIENTPLATFORM_PRODUCTION_SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?CLIENTPLATFORM_PRODUCTION_SSH_KNOWN_HOSTS is required}"
          case "$SSH_HOST" in
            *[!A-Za-z0-9._:-]*|'') echo "invalid production SSH host" >&2; exit 2 ;;
          esac
          case "$SSH_USER" in
            *[!A-Za-z0-9._-]*|'') echo "invalid production SSH user" >&2; exit 2 ;;
          esac
          SSH_PORT="${SSH_PORT_SECRET:-22}"
          case "$SSH_PORT" in
            *[!0-9]*|'') echo "invalid production SSH port" >&2; exit 2 ;;
          esac
          if [ "$SSH_PORT" -lt 1 ] || [ "$SSH_PORT" -gt 65535 ]; then
            echo "production SSH port outside 1..65535" >&2
            exit 2
          fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Configure pinned production SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/clientplatform-production-ssh-key"
          known_hosts="$RUNNER_TEMP/clientplatform-production-known-hosts"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Recover, enable and register production MAX entry
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/clientplatform-production-ssh-key"
          known_hosts="$RUNNER_TEMP/clientplatform-production-known-hosts"
          ssh \
            -p "$SSH_PORT" \
            -i "$key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" "sudo -n bash -s" <<'REMOTE'
          set -Eeuo pipefail
          repo=/opt/clientplatform
          env_file="$repo/deploy/clientplatform/clientplatform.env"
          cd "$repo"

          if [ "$(git symbolic-ref --quiet --short HEAD 2>/dev/null || true)" != "main" ]; then
            echo "CLIENTPLATFORM_MAX_REPAIR_FAILED:production_not_on_main" >&2
            exit 10
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=no --ignore-submodules=none)" ]; then
            echo "CLIENTPLATFORM_MAX_REPAIR_FAILED:tracked_worktree_dirty" >&2
            exit 11
          fi
          if [ ! -f "$env_file" ]; then
            echo "CLIENTPLATFORM_MAX_REPAIR_FAILED:production_env_missing" >&2
            exit 12
          fi

          backup="$env_file.before-max-entry-repair-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -p "$env_file" "$backup"
          rollback_needed=1
          rollback() {
            if [ "$rollback_needed" = "1" ] && [ -f "$backup" ]; then
              cp -p "$backup" "$env_file"
              cd "$repo/deploy/clientplatform"
              compose=(docker compose)
              if [ -f .env ]; then compose+=(--env-file .env); fi
              compose+=(--env-file clientplatform.env -f compose.production.yml)
              "${compose[@]}" up -d --no-deps --force-recreate app >/dev/null || true
              echo "CLIENTPLATFORM_MAX_REPAIR_ROLLED_BACK" >&2
            fi
          }
          trap rollback EXIT

          recovery_report="$(
            python3 scripts/clientplatform_recover_max_production_env.py \
              --env-file "$env_file" \
              --timeout-sec 15
          )" || {
            status=$?
            printf '%s\n' "$recovery_report"
            echo "CLIENTPLATFORM_MAX_REPAIR_FAILED:credential_recovery" >&2
            exit "$status"
          }
          printf '%s\n' "$recovery_report"
          echo "CLIENTPLATFORM_MAX_REPAIR_CONFIG_OK"

          cd "$repo/deploy/clientplatform"
          compose=(docker compose)
          if [ -f .env ]; then compose+=(--env-file .env); fi
          compose+=(--env-file clientplatform.env -f compose.production.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --no-deps --force-recreate app

          ready=0
          for _ in $(seq 1 45); do
            headers="$(mktemp)"
            code="$(curl --max-time 5 -sS -o /dev/null -D "$headers" -w '%{http_code}' https://app.clientplatform.ru/clientplatform/open/max || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"
            if [ "$code" = "302" ] && printf '%s' "$location" | grep -Eq '^https://(www\.)?max\.ru(/|\?|$)'; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "CLIENTPLATFORM_MAX_REPAIR_FAILED:owner_entry_not_ready" >&2
            exit 30
          fi
          echo "CLIENTPLATFORM_MAX_OWNER_ENTRY_OK"

          # From this point the public MAX endpoint is live with a provider-verified
          # token. Keep it live even if provider registration needs a retry, so a
          # partially-created subscription can never be pointed at a disabled route.
          rollback_needed=0
          trap - EXIT

          "${compose[@]}" run --rm --no-deps --entrypoint python app \
            scripts/register_max_webhook.py --apply --timeout-sec 20
          "${compose[@]}" run --rm --no-deps --entrypoint python app \
            scripts/max_provider_audit.py
          echo "CLIENTPLATFORM_MAX_PROVIDER_OK"

          rm -f "$backup"
          echo "CLIENTPLATFORM_MAX_REPAIR_OK"
          REMOTE

      - name: Verify public MAX owner entry
        shell: bash
        run: |
          set -Eeuo pipefail
          headers="$RUNNER_TEMP/clientplatform-max-entry.headers"
          code="$(curl --max-time 10 -sS -o /dev/null -D "$headers" -w '%{http_code}' https://app.clientplatform.ru/clientplatform/open/max)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          test "$code" = "302"
          printf '%s' "$location" | grep -Eq '^https://(www\.)?max\.ru(/|\?|$)'
          echo "CLIENTPLATFORM_MAX_PUBLIC_ENTRY_OK"
