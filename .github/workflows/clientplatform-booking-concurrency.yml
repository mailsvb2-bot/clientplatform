name: ClientPlatform Booking Concurrency

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  booking-concurrency:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientplatform_booking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clientplatform_booking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      LOAD_DOTENV: '0'
      CLIENTPLATFORM_DB_ENGINE: postgres
      CLIENTPLATFORM_DATABASE_NAME: clientplatform_booking_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clientplatform_booking_ci
      POSTGRES_REUSE_CONNECTIONS: '0'
      BOT_TOKEN: '000000:CI'
      TELEGRAM_TRANSPORT: polling
      TELEGRAM_WEBHOOK_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: SQLite fallback, DST and dual-role regression wall
        env:
          CLIENTPLATFORM_DB_ENGINE: sqlite
          DATABASE_URL: ''
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_clientplatform_booking_hardening.py \
            tests/test_clientplatform_dual_role_entry.py \
            tests/test_handlers_clientplatform_dual_role_entry.py \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-booking-unit.log"

      - name: Two-connection PostgreSQL booking matrix
        run: |
          set -o pipefail
          python scripts/probe_postgres_booking_concurrency.py \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-booking-postgres.log"

      - name: Two-connection PostgreSQL draft lesson editing
        run: |
          set -o pipefail
          python scripts/probe_postgres_program_draft_lesson_concurrency.py \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-draft-lesson-postgres.log"

      - name: Upload booking concurrency logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clientplatform-booking-concurrency-logs
          path: |
            ${{ runner.temp }}/clientplatform-booking-unit.log
            ${{ runner.temp }}/clientplatform-booking-postgres.log
            ${{ runner.temp }}/clientplatform-draft-lesson-postgres.log
          if-no-files-found: warn
