name: One-shot privacy export integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/one-time-privacy-export-links'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/one-time-privacy-export-links
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Apply exact patch and focused tests
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_privacy_payment_runtime_followup.py")
          source = path.read_text(encoding="utf-8")
          old = '    assert "не зашифрован" in warning[0].text\n'
          new = '    assert "одноразовую HTTPS-ссылку" in warning[0].text\n'
          if source.count(old) != 1:
              raise SystemExit("legacy privacy warning assertion anchor mismatch")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python tools/agent_patch_one_time_privacy_export.py 2>&1 | tee "$RUNNER_TEMP/privacy-export-patch.log"

      - name: Upload patch log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: privacy-export-patch-log
          path: ${{ runner.temp }}/privacy-export-patch.log
          if-no-files-found: warn

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            deploy/metrotherapy.env.example \
            handlers/info.py \
            runtime/ingress_flags.py \
            runtime/messenger_webhooks.py \
            runtime/privacy_export_http.py \
            services/messenger/reply_dispatcher.py \
            services/messenger/text_ui_router.py \
            services/migrations/__init__.py \
            services/migrations/user_privacy_export_tokens_v1.py \
            services/privacy_export_links.py \
            services/privacy_manifest.py \
            tests/test_privacy_export_download.py \
            tests/test_privacy_payment_runtime_followup.py \
            tests/test_privacy_user_commands.py
          git diff --cached --check
          git commit -m "Serve privacy exports through one-time HTTPS links"
          git push origin HEAD:agent/one-time-privacy-export-links
