name: Materialize ClientPlatform Admin

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/materialize-clientplatform-admin.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      EXPECTED_ARCHIVE_SHA256: dd444260ca48f9a4f738d9f4e813e5801b55574a5fe1d74581eb0787ea3f801f
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct verified archive from immutable Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : > "$RUNNER_TEMP/admin-materialize.b64"
          blobs=(
            1a0caf8635f2e026dc4ebf0799e83a265fd08ac7
            7ed4a0a03d458d964f21d9ced6c8422b9ce5c8d8
            1cbebcc64c94a998b16c2daa15de825783e57f03
            6f75e37d8ba498b3132dd6f4604b2cfb52985eb6
            557504a945953f79a9d3ba5888721d42ae2f7039
            7b0a5b0a551d345fd064c3d8e1570d337b3273ad
            0301834e262671c640b9638b3057f6dafec07183
            1282281506365e003a982cdea0763fabba77a115
            ee63d485c4c6ed76e30cc7eb18f79032267be843
            ce47be496e9cde5ddd99f4d698c79c0b366c0e76
            c57e18ef1a04f3fc6f66fe82adfd84d69e21ad89
            78a3861ce99076160885c36cf42cb5422330c9f3
            08f5c2ef63e0c02d384b9de3e9541efff2274867
          )
          for blob in "${blobs[@]}"; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$blob" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 --decode \
            >> "$RUNNER_TEMP/admin-materialize.b64"
          done
          base64 --decode \
            "$RUNNER_TEMP/admin-materialize.b64" \
            > "$RUNNER_TEMP/admin-materialize.tar.gz"
          echo "$EXPECTED_ARCHIVE_SHA256  $RUNNER_TEMP/admin-materialize.tar.gz" \
            | sha256sum --check --strict

      - name: Verify and materialize source
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -tzf "$RUNNER_TEMP/admin-materialize.tar.gz" >/dev/null
          tar -xzf "$RUNNER_TEMP/admin-materialize.tar.gz" -C .
          python -m py_compile \
            clientplatform/application/admin_ops.py \
            clientplatform/runtime/admin_observability.py \
            core/telegram_multi_egress.py \
            handlers/clientplatform_admin_extension.py \
            tests/test_application_clientplatform_admin_ops_runtime.py \
            tests/test_handlers_clientplatform_admin_full_matrix.py \
            tests/test_core_telegram_multi_egress_runtime.py \
            tests/test_handlers_clientplatform_callback_load_chaos.py
          rm -rf .github/materialize-admin
          rm -rf .github/admin-payload-v2
          rm -f .github/workflows/materialize-clientplatform-admin.yml

      - name: Commit verified source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Materialize complete ClientPlatform admin operations'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
