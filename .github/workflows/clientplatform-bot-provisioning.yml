name: ClientPlatform Bot Provisioning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientplatform-bot-provisioning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot-provisioning:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientplatform_provisioning_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clientplatform_provisioning_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      LOAD_DOTENV: "0"
      METRO_DB_ENGINE: postgres
      CLIENTPLATFORM_DATABASE_NAME: clientplatform_provisioning_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clientplatform_provisioning_ci
      POSTGRES_REUSE_CONNECTIONS: "0"
      BOT_TOKEN: ci-bot-token-material
      TELEGRAM_TRANSPORT: polling
      TELEGRAM_WEBHOOK_ENABLED: "0"
      CLIENTPLATFORM_BOT_GATEWAY_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Provisioning and owner wizard regression wall
        run: |
          set -o pipefail
          python -m unittest -v \
            tests/test_clientplatform_bot_provisioning.py \
            tests/test_runtime_clientplatform_bot_provisioning.py \
            tests/test_application_clientplatform_bot_provisioning.py \
            tests/test_runtime_clientplatform_bot_setup_ui.py \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-bot-provisioning-tests.log"

      - name: Two-connection PostgreSQL provisioning matrix
        run: |
          set -o pipefail
          python scripts/probe_postgres_bot_provisioning.py \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-bot-provisioning-postgres.log"

      - name: Upload bot provisioning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clientplatform-bot-provisioning-evidence
          path: |
            ${{ runner.temp }}/clientplatform-bot-provisioning-tests.log
            ${{ runner.temp }}/clientplatform-bot-provisioning-postgres.log
          if-no-files-found: warn
