name: ClientPlatform Managed Bot Gateway

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  managed-bot-gateway:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientplatform_gateway_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clientplatform_gateway_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      LOAD_DOTENV: '0'
      CLIENTPLATFORM_DB_ENGINE: postgres
      CLIENTPLATFORM_DATABASE_NAME: clientplatform_gateway_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clientplatform_gateway_ci
      POSTGRES_REUSE_CONNECTIONS: '0'
      BOT_TOKEN: '000000:CI'
      TELEGRAM_TRANSPORT: polling
      TELEGRAM_WEBHOOK_ENABLED: '0'
      CLIENTPLATFORM_BOT_GATEWAY_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Polling gateway unit and runtime regression wall
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_clientplatform_bot_gateway.py \
            tests/test_clientplatform_managed_bot_lifecycle.py \
            tests/test_clientplatform_bot_gateway_preflight.py \
            tests/test_runtime_clientplatform_managed_bot_gateway.py \
            tests/test_runtime_clientplatform_managed_bot_gateway_http.py \
            tests/test_handlers_clientplatform_managed_bot_entry.py \
            tests/test_runtime_clientplatform_polling_entry.py \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-bot-gateway-unit.log"

      - name: Two-connection PostgreSQL gateway matrix
        run: |
          set -o pipefail
          python scripts/probe_postgres_bot_gateway_concurrency.py \
            2>&1 | tee "$RUNNER_TEMP/clientplatform-bot-gateway-postgres.log"

      - name: Upload Managed Bot Gateway evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clientplatform-managed-bot-gateway-logs
          path: |
            ${{ runner.temp }}/clientplatform-bot-gateway-unit.log
            ${{ runner.temp }}/clientplatform-bot-gateway-postgres.log
          if-no-files-found: warn
