name: One-shot client pagination safety classification

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/paginate-booking-surfaces'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/paginate-booking-surfaces
      - name: Align client page callbacks with navigation safety
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          safety = Path('handlers/clientplatform_interaction_safety.py')
          text = safety.read_text(encoding='utf-8')
          anchor = '    "cp:cap:",\n    "cp:cprograms:",\n'
          replacement = '    "cp:cap:",\n    "cp:client:",\n    "cp:cprograms:",\n'
          if text.count(anchor) != 2:
              raise SystemExit(f'expected state/repeatable navigation anchors twice, got {text.count(anchor)}')
          safety.write_text(text.replace(anchor, replacement), encoding='utf-8')

          tests = Path('tests/test_handlers_clientplatform_interaction_safety.py')
          test_text = tests.read_text(encoding='utf-8')
          old = '    callback = telegram_callback(data="cp:client:business")\n'
          new = '    callback = telegram_callback(data="cp:book:business:slot")\n'
          if test_text.count(old) != 1:
              raise SystemExit(f'expected exactly one middleware dedup callback fixture, got {test_text.count(old)}')
          tests.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall handlers/clientplatform_interaction_safety.py tests/test_handlers_clientplatform_interaction_safety.py
          git diff --check
          rm .github/workflows/one-shot-client-pagination-safety.yml
          git config user.name "clientplatform-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Classify client booking pages as repeatable navigation"
          git push origin HEAD:agent/paginate-booking-surfaces
