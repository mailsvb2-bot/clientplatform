name: One-shot production deploy recovery fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Apply exact patch and focused tests
        run: |
          python tools/apply_pr215_patch.py
          python -m py_compile scripts/production_gate.py tests/test_production_runtime_gate_contract.py
          bash -n scripts/immutable_deploy.sh
          python -m pytest -q -p no:cacheprovider \
            tests/test_production_runtime_gate_contract.py \
            tests/test_immutable_deploy_contract.py \
            tests/test_production_gate_rollback_recovery.py \
            tests/test_runtime_write_guard_release_compatibility.py

      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/production_gate.py scripts/immutable_deploy.sh tests/test_production_runtime_gate_contract.py
          git commit -m "Fix production gate runtime dependency and rollback guard ordering"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
