name: Python 3.13 Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  py313:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: prod
      VALIDATOR_RELEASE_MODE: '1'
      VALIDATOR_GUARDRAILS_STRICT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python 3.13 hash lock
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --require-hashes -r requirements-py313.txt

      - name: Compile project surface
        run: |
          python -m compileall \
            services \
            scripts \
            handlers \
            core \
            runtime \
            config \
            app.py \
            main.py

      - name: Smoke no polling
        run: python scripts/smoke.py
