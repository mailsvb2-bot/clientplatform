name: Apply AI Commerce candidate

on:
  push:
    branches:
      - feat/ai-commerce-layer-v2
    paths:
      - .github/workflows/ai-commerce-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Apply exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          encoded = Path('.github/ai-commerce-candidate.patch.gz.b64').read_text().strip()
          raw = gzip.decompress(base64.b64decode(encoded))
          Path('/tmp/ai-commerce.patch').write_bytes(raw)
          PY
          printf '%s  %s\n' '9a1c3bc08a36fa3cd71c73c717105a2b0c4836837ac3f8f5a8decf5ef5dfbbef' /tmp/ai-commerce.patch | sha256sum -c -
          git apply --index --binary /tmp/ai-commerce.patch
          git rm .github/ai-commerce-candidate.patch.gz.b64 .github/workflows/ai-commerce-apply.yml
          git config user.name 'BusinesMetro'
          git config user.email 'mailsvb2@gmail.com'
          git commit -m 'Add user-facing AI commerce tariff controls'
          git push origin HEAD:feat/ai-commerce-layer-v2
