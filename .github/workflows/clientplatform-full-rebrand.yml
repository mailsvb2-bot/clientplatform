name: clientplatform Brand Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  brand-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enforce clientplatform naming across tracked files
        run: python scripts/clientplatform_rebrand.py --include-workflows --check
