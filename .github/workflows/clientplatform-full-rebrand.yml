name: clientplatform Full Rebrand

on:
  push:
    branches:
      - agent/full-clientplatform-rebrand
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: clientplatform-full-rebrand
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full rebrand branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: agent/full-clientplatform-rebrand

      - name: Apply repository-wide clientplatform rebrand
        run: python scripts/clientplatform_rebrand.py

      - name: Enforce zero legacy brand references
        run: python scripts/clientplatform_rebrand.py --check

      - name: Commit complete migration
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rebrand changes were produced"
            exit 1
          fi
          git diff --cached --stat
          git commit -m "Rebrand repository as clientplatform"
          git format-patch -1 --stdout > "$RUNNER_TEMP/clientplatform-rebrand.patch"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/clientplatform-rebrand-tree.txt"
          git diff-tree --no-commit-id --name-status -r HEAD \
            > "$RUNNER_TEMP/clientplatform-rebrand-files.txt"

      - name: Push migration commit
        id: push
        continue-on-error: true
        run: |
          set -o pipefail
          git push origin HEAD:agent/full-clientplatform-rebrand \
            > "$RUNNER_TEMP/clientplatform-rebrand-push.log" 2>&1

      - name: Upload rebrand diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clientplatform-rebrand-diagnostics
          path: |
            ${{ runner.temp }}/clientplatform-rebrand.patch
            ${{ runner.temp }}/clientplatform-rebrand-tree.txt
            ${{ runner.temp }}/clientplatform-rebrand-files.txt
            ${{ runner.temp }}/clientplatform-rebrand-push.log
          if-no-files-found: error

      - name: Fail when branch update was rejected
        if: steps.push.outcome != 'success'
        run: |
          cat "$RUNNER_TEMP/clientplatform-rebrand-push.log"
          exit 1
