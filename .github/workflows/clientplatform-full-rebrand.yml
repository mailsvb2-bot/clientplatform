name: clientplatform Brand Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  brand-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enforce clientplatform naming across tracked files
        run: python scripts/clientplatform_rebrand.py --include-workflows --check
