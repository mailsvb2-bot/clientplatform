name: Patch ClientPlatform Optional Analytics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/patch-clientplatform-optional-analytics.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Make added analytics reads fail-soft
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('handlers/clientplatform_admin_extension.py')
          source = path.read_text(encoding='utf-8')

          marker = '_INSTALLED = False\n\n\nasync def _optional_thread('
          constants = (
              '_INSTALLED = False\n\n'
              '_EMPTY_INSIGHTS = admin_ops.AdminInsightSnapshot(\n'
              '    active_customers=0,\n'
              '    active_offerings=0,\n'
              '    active_invites=0,\n'
              '    claimed_invites=0,\n'
              '    enrollments=0,\n'
              '    completed_enrollments=0,\n'
              '    publication_drafts=0,\n'
              '    publications_published=0,\n'
              '    paid_payments=0,\n'
              '    paid_amount_minor=0,\n'
              '    payment_currency="RUB",\n'
              '    priced_offerings=0,\n'
              '    active_staff=0,\n'
              ')\n'
              '_EMPTY_INTERACTION = admin_ops.InteractionSnapshot(\n'
              '    count=0,\n'
              '    successes=0,\n'
              '    failures=0,\n'
              '    p50_ms=0,\n'
              '    p95_ms=0,\n'
              '    max_ms=0,\n'
              '    ack_p95_ms=0,\n'
              '    lock_p95_ms=0,\n'
              '    telegram_p95_ms=0,\n'
              '    window_minutes=60,\n'
              ')\n\n\n'
              'async def _optional_thread('
          )
          if source.count(marker) != 1:
              raise SystemExit(f'unexpected_constants_marker_count:{source.count(marker)}')
          source = source.replace(marker, constants, 1)

          insight_old = (
              '        asyncio.to_thread('
              'admin_ops.business_admin_insights, actor=ctx.actor),\n'
          )
          insight_new = (
              '        _optional_thread(\n'
              '            admin_ops.business_admin_insights,\n'
              '            default=_EMPTY_INSIGHTS,\n'
              '            actor=ctx.actor,\n'
              '        ),\n'
          )
          if source.count(insight_old) != 3:
              raise SystemExit(f'unexpected_insight_count:{source.count(insight_old)}')
          source = source.replace(insight_old, insight_new)

          interaction_old = (
              '        asyncio.to_thread(\n'
              '            admin_ops.interaction_snapshot,\n'
              '            actor=ctx.actor,\n'
              '            window_minutes=60,\n'
              '        ),\n'
          )
          interaction_new = (
              '        _optional_thread(\n'
              '            admin_ops.interaction_snapshot,\n'
              '            default=_EMPTY_INTERACTION,\n'
              '            actor=ctx.actor,\n'
              '            window_minutes=60,\n'
              '        ),\n'
          )
          if source.count(interaction_old) != 2:
              raise SystemExit(
                  f'unexpected_interaction_count:{source.count(interaction_old)}'
              )
          source = source.replace(interaction_old, interaction_new)

          setting_old = (
              '        asyncio.to_thread(\n'
              '            admin_ops.get_admin_setting,\n'
              '            actor=ctx.actor,\n'
              '            key="autopilot_enabled",\n'
              '            default="false",\n'
              '        ),\n'
          )
          setting_new = (
              '        _optional_thread(\n'
              '            admin_ops.get_admin_setting,\n'
              '            default="false",\n'
              '            actor=ctx.actor,\n'
              '            key="autopilot_enabled",\n'
              '        ),\n'
          )
          if source.count(setting_old) != 1:
              raise SystemExit(f'unexpected_setting_count:{source.count(setting_old)}')
          source = source.replace(setting_old, setting_new, 1)

          audit_old = (
              '        asyncio.to_thread('
              'admin_ops.recent_audit_events, actor=ctx.actor, limit=12),\n'
          )
          audit_new = (
              '        _optional_thread(\n'
              '            admin_ops.recent_audit_events,\n'
              '            default=[],\n'
              '            actor=ctx.actor,\n'
              '            limit=12,\n'
              '        ),\n'
          )
          if source.count(audit_old) != 1:
              raise SystemExit(f'unexpected_audit_count:{source.count(audit_old)}')
          source = source.replace(audit_old, audit_new, 1)

          alerts_old = (
              '    alerts = await asyncio.to_thread(\n'
              '        admin_ops.refresh_interaction_alerts,\n'
              '        actor=ctx.actor,\n'
              '        route_redundant=route.egress_redundant,\n'
              '    )\n'
          )
          alerts_new = (
              '    alerts = await _optional_thread(\n'
              '        admin_ops.refresh_interaction_alerts,\n'
              '        default=[],\n'
              '        actor=ctx.actor,\n'
              '        route_redundant=route.egress_redundant,\n'
              '    )\n'
          )
          if source.count(alerts_old) != 1:
              raise SystemExit(
                  f'unexpected_alert_refresh_count:{source.count(alerts_old)}'
              )
          source = source.replace(alerts_old, alerts_new, 1)

          subscription_old = (
              '        asyncio.to_thread('
              'admin_ops.get_subscription_state, actor=ctx.actor),\n'
          )
          subscription_new = (
              '        _optional_thread(\n'
              '            admin_ops.get_subscription_state,\n'
              '            default=admin_ops.SubscriptionState(\n'
              '                business_id=ctx.business_id,\n'
              '                plan_key="not_configured",\n'
              '                status="inactive",\n'
              '                included_staff=0,\n'
              '                included_customers=0,\n'
              '                started_at="не активирован",\n'
              '                renews_at=None,\n'
              '                updated_at="не активирован",\n'
              '            ),\n'
              '            actor=ctx.actor,\n'
              '        ),\n'
          )
          if source.count(subscription_old) != 1:
              raise SystemExit(
                  f'unexpected_subscription_count:{source.count(subscription_old)}'
              )
          source = source.replace(subscription_old, subscription_new, 1)

          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile handlers/clientplatform_admin_extension.py
          rm -f .github/workflows/patch-clientplatform-optional-analytics.yml

      - name: Commit exact patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Make ClientPlatform optional analytics fail-soft'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
