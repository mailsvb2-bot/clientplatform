name: clientplatform Program Progress Apply

on:
  push:
    branches:
      - agent/customer-program-progress

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/customer-program-progress
          fetch-depth: 1

      - name: Apply progress portal patches
        run: |
          set -Eeuo pipefail
          python scripts/.patch_progress_repository.py
          python scripts/.patch_progress_handler.py
          rm -f scripts/.patch_progress_repository.py
          rm -f scripts/.patch_progress_handler.py
          rm -f .github/workflows/clientplatform-progress-apply.yml
          python -m compileall -q \
            clientplatform/domain/program_progress.py \
            clientplatform/infrastructure/program_progress_repository.py \
            clientplatform/infrastructure/customer_progress_repository.py \
            clientplatform/application/progress.py \
            handlers/clientplatform_control.py \
            tests/test_clientplatform_program_progress_portal.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire customer program progress portal"
          git push origin HEAD:agent/customer-program-progress
