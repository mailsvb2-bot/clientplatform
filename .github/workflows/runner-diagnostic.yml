name: Runner Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Runner sanity
        run: |
          echo "runner ok"
          uname -a
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository sanity
        run: |
          pwd
          ls -la
          test -f README.md
