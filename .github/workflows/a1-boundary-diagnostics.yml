name: A1 Boundary Diagnostics

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Tenancy boundary
        run: python -m unittest -v tests.test_a1_tenancy_foundation

      - name: Customer boundary
        run: python -m unittest -v tests.test_a1_customer_boundary

      - name: Program delivery vertical
        run: python -m unittest -v tests.test_a1_program_delivery_vertical

      - name: Connections and dispatch outbox
        run: |
          set -o pipefail
          python -m unittest -v tests.test_a1_connections_dispatch_outbox \
            2>&1 | tee "$RUNNER_TEMP/a1-connections-dispatch.log"

      - name: Signed media and runtime lifecycle
        run: |
          set -o pipefail
          python -m unittest -v tests.test_a1_signed_media_runtime_composition \
            2>&1 | tee "$RUNNER_TEMP/a1-signed-media-runtime.log"

      - name: Upload A1 boundary diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a1-boundary-diagnostic-log
          path: |
            ${{ runner.temp }}/a1-connections-dispatch.log
            ${{ runner.temp }}/a1-signed-media-runtime.log
          if-no-files-found: warn
