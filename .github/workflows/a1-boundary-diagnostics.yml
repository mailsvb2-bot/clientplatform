name: A1 Boundary Diagnostics

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Tenancy boundary
        run: python -m unittest -v tests.test_a1_tenancy_foundation

      - name: Customer boundary
        run: python -m unittest -v tests.test_a1_customer_boundary

      - name: Program delivery vertical
        run: python -m unittest -v tests.test_a1_program_delivery_vertical

      - name: Connections and dispatch outbox
        run: python -m unittest -v tests.test_a1_connections_dispatch_outbox
