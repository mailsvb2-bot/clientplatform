name: clientplatform Booking Bundle Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/enable-control-booking
          fetch-depth: 1

      - name: Apply complete booking bundle
        run: |
          set -Eeuo pipefail
          mapfile -t chunks < <(find scripts -maxdepth 1 -type f -name '.clientplatform-booking-bundle-*' | sort)
          if [ "${#chunks[@]}" -ne 12 ]; then
            echo "Booking bundle is not complete yet (${#chunks[@]}/12)"
            exit 0
          fi

          cat "${chunks[@]}" | base64 --decode > "$RUNNER_TEMP/clientplatform-booking.tar.gz"
          echo "0a1af60bdb6be8c10c9785f23d0b9a69cd8abce060f7a461ae187a071ab8a659  $RUNNER_TEMP/clientplatform-booking.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/clientplatform-booking.tar.gz"

          rm -f "${chunks[@]}"
          rm -f .github/workflows/clientplatform-booking-bundle-apply.yml

          python -m compileall -q clientplatform handlers services/db/schema tests
          python scripts/check_clientplatform_canon.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable ClientPlatform booking and client portal"
          git push origin HEAD:agent/enable-control-booking
